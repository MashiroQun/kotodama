<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>言霊チューナー | MUSUBI AI</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;400;700&family=Noto+Sans+JP:wght@100;400;900&family=Noto+Sans+Siddham&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<style>
    :root { --accent-color: #FF3333; --glass-bg: rgba(30, 30, 30, 0.25); --glass-border: rgba(255, 255, 255, 0.15); }
    * { -webkit-tap-highlight-color: transparent; outline: none; }
    html, body { margin: 0; padding: 0; width: 100%; height: 100dvh; background: #000; color: #FFF; font-family: 'Inter', 'Noto Sans JP', sans-serif; overflow: hidden; touch-action: none; }
    
    #webgl-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; }
    #bonji-bg { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-family: 'Noto Sans Siddham'; font-size: 50vh; color: var(--accent-color); opacity: 0.15; z-index: 1; pointer-events: none; transition: color 0.8s, opacity 0.5s; }

    #ui-layer { position: relative; z-index: 10; display: flex; flex-direction: column; justify-content: space-between; align-items: center; height: 100%; padding: env(safe-area-inset-top) 5% env(safe-area-inset-bottom); box-sizing: border-box; }

    header { margin-top: 2vh; text-align: center; }
    .title-main { font-weight: 900; font-size: 22px; letter-spacing: 0.3em; }
    .title-sub { font-size: 10px; letter-spacing: 0.6em; color: var(--accent-color); opacity: 0.8; margin-top: 4px; }

    #display-center { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; width: 100%; }
    .kanji-wrap { position: relative; display: flex; flex-direction: column; align-items: center; }
    .ruby { font-size: 18px; font-weight: 400; opacity: 0.6; letter-spacing: 0.4em; margin-bottom: -10px; }
    .kanji { font-size: clamp(100px, 25vw, 150px); font-weight: 900; color: var(--accent-color); text-shadow: 0 0 40px rgba(0,0,0,0.5); transition: color 0.8s; }
    .meaning-text { font-size: 13px; opacity: 0.5; margin-top: 10px; letter-spacing: 0.1em; }

    /* Glassmorphism Panel */
    #control-panel { 
        width: 100%; max-width: 380px; margin-bottom: 2vh;
        background: var(--glass-bg);
        backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
        border: 0.5px solid var(--glass-border);
        border-radius: 32px; padding: 24px; box-sizing: border-box;
        box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }

    #chakra-dots { display: flex; justify-content: space-between; margin-bottom: 24px; }
    .dot { width: 40px; height: 40px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.3); display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; transition: all 0.3s; }
    .dot.active { transform: scale(1.15); border-color: #FFF; box-shadow: 0 0 15px var(--accent-color); }

    .main-action { 
        width: 100%; height: 64px; border-radius: 32px; 
        border: 2px solid var(--accent-color); background: transparent;
        color: var(--accent-color); font-size: 18px; font-weight: 700; letter-spacing: 0.2em;
        margin-bottom: 16px; transition: all 0.3s;
    }
    .main-action:active { transform: scale(0.96); background: var(--accent-color); color: #000; }

    .sub-controls { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .sub-btn { 
        height: 44px; border-radius: 12px; background: rgba(255,255,255,0.05); 
        border: 0.5px solid var(--glass-border); color: #FFF; font-size: 11px; font-weight: 400; 
    }
    .sub-btn.highlight { border-color: rgba(255,255,255,0.4); color: var(--accent-color); font-weight: 700; }

    #toast { position: fixed; top: 15%; left: 50%; transform: translateX(-50%); padding: 10px 20px; border-radius: 20px; background: #FFF; color: #000; font-size: 12px; font-weight: 700; opacity: 0; transition: 0.4s; z-index: 100; }
</style>
</head>
<body>
    <div id="toast">SYSTEM UPDATED</div>
    <div id="webgl-container"></div>
    <div id="bonji-bg">𑖀</div>
    
    <main id="ui-layer">
        <header>
            <div class="title-main">言霊チューナー</div>
            <div class="title-sub">RESONANCE TOOL</div>
        </header>

        <section id="display-center">
            <div class="kanji-wrap">
                <div id="ruby" class="ruby">ち</div>
                <div id="kanji" class="kanji">地</div>
                <div id="meaning" class="meaning-text">BASE / ROOT / MULADHARA</div>
            </div>
        </section>

        <section id="control-panel">
            <div id="chakra-dots"></div>
            
            <button id="main-btn" class="main-action">START SESSION</button>

            <div class="sub-controls">
                <button id="timer-btn" class="sub-btn">TIMER: 10M</button>
                <button id="mode-btn" class="sub-btn">MODE: BASIC</button>
                <button id="breath-btn" class="sub-btn">BREATH: 8s</button>
                <button id="update-btn" class="sub-btn" onclick="location.reload()">REFRESH</button>
            </div>
        </section>
    </main>

<script>
    const chakraData = [
        { name: "地", ruby: "ち", color: "#FF3333", bonji: "𑖀", freq: 130.81, meaning: "BASE / ROOT / MULADHARA" },
        { name: "海", ruby: "うみ", color: "#FF8C00", bonji: "𑖪", freq: 146.83, meaning: "SACRAL / CREATION / SVADHISTHANA" },
        { name: "陽", ruby: "よう", color: "#FFD700", bonji: "𑖨", freq: 164.81, meaning: "SOLAR / WILL / MANIPURA" },
        { name: "和", ruby: "わ", color: "#00CC66", bonji: "𑖮", freq: 174.61, meaning: "HEART / LOVE / ANAHATA" },
        { name: "響", ruby: "ひびき", color: "#00BFFF", bonji: "𑖏", freq: 196.00, meaning: "THROAT / SPACE / VISHUDDHA" },
        { name: "理", ruby: "ことわり", color: "#4169E1", bonji: "𑖌", freq: 220.00, meaning: "THIRD-EYE / WISDOM / AJNA" },
        { name: "宙", ruby: "そら", color: "#EE82EE", bonji: "𑖮𑖳𑖽", freq: 246.94, meaning: "CROWN / UNITY / SAHASRARA" }
    ];

    let currentIdx = 0;
    let isTuning = false;
    let timerMins = 10;
    let timerActive = false;
    let sessionStartTime = 0;
    let timerRef = null;

    // --- UI Logic ---
    const mainBtn = document.getElementById('main-btn');
    const timerBtn = document.getElementById('timer-btn');
    const dotContainer = document.getElementById('chakra-dots');

    function updateUI() {
        const d = chakraData[currentIdx];
        document.getElementById('kanji').innerText = d.name;
        document.getElementById('ruby').innerText = d.ruby;
        document.getElementById('bonji-bg').innerText = d.bonji;
        document.getElementById('meaning').innerText = d.meaning;
        document.documentElement.style.setProperty('--accent-color', d.color);
        
        document.querySelectorAll('.dot').forEach((dot, i) => {
            dot.classList.toggle('active', i === currentIdx);
            dot.style.color = i === currentIdx ? '#FFF' : 'rgba(255,255,255,0.4)';
        });
        
        if (!timerActive) {
            timerBtn.innerText = `TIMER: ${timerMins}M`;
        }
    }

    chakraData.forEach((_, i) => {
        const dot = document.createElement('div');
        dot.className = 'dot';
        dot.innerText = i + 1;
        dot.onclick = () => { if(!isTuning) { currentIdx = i; updateUI(); } };
        dotContainer.appendChild(dot);
    });

    timerBtn.onclick = () => {
        if (timerActive) return;
        const steps = [5, 10, 15, 20, 30, 45, 60];
        let idx = steps.indexOf(timerMins);
        timerMins = steps[(idx + 1) % steps.length];
        updateUI();
    };

    // --- Audio Logic (Tone.js) ---
    const synth = new Tone.Oscillator(440, "triangle").toDestination();
    const lfo = new Tone.LFO("4n", 400, 600).connect(synth.frequency);
    synth.volume.value = -Infinity;

    async function startSession() {
        await Tone.start();
        isTuning = true;
        timerActive = true;
        sessionStartTime = Date.now();
        
        synth.frequency.value = chakraData[currentIdx].freq;
        synth.volume.rampTo(-10, 2);
        synth.start();
        
        mainBtn.innerText = "STOP SESSION";
        timerBtn.classList.add('highlight');
        
        runTimer();
    }

    function runTimer() {
        const elapsedSec = Math.floor((Date.now() - sessionStartTime) / 1000);
        const totalSec = timerMins * 60;
        const remain = totalSec - elapsedSec;

        if (remain <= 0) {
            stopSession(true);
            return;
        }

        const m = Math.floor(remain / 60);
        const s = remain % 60;
        timerBtn.innerText = `${m}:${s < 10 ? '0' : ''}${s}`;
        timerRef = setTimeout(runTimer, 1000);
    }

    async function stopSession(auto = false) {
        clearTimeout(timerRef);
        isTuning = false;
        timerActive = false;
        
        mainBtn.innerText = auto ? "RESETTING..." : "STOPPING...";
        mainBtn.disabled = true;
        
        synth.volume.rampTo(-Infinity, 3);
        
        setTimeout(() => {
            synth.stop();
            mainBtn.disabled = false;
            mainBtn.innerText = "START SESSION";
            updateUI();
            timerBtn.classList.remove('highlight');
        }, 3200);
    }

    mainBtn.onclick = () => isTuning ? stopSession() : startSession();

    // --- Visuals (Three.js Lite) ---
    let renderer, scene, camera, points;
    function initThree() {
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
        camera.position.z = 5;
        renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.getElementById('webgl-container').appendChild(renderer.domElement);

        const geo = new THREE.BufferGeometry();
        const pos = [];
        for(let i=0; i<1000; i++) pos.push((Math.random()-0.5)*10, (Math.random()-0.5)*10, (Math.random()-0.5)*10);
        geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
        const mat = new THREE.PointsMaterial({ size: 0.02, color: 0xffffff, transparent: true, opacity: 0.5 });
        points = new THREE.Points(geo, mat);
        scene.add(points);
    }

    function animate() {
        requestAnimationFrame(animate);
        if(points) {
            points.rotation.y += 0.001;
            points.material.color.set(chakraData[currentIdx].color);
            points.material.opacity = isTuning ? 0.8 : 0.2;
        }
        renderer.render(scene, camera);
    }

    window.onload = () => { initThree(); animate(); updateUI(); };
</script>
</body>
</html>
