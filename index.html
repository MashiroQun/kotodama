<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="言霊チューナー">
    <title>言霊チューナー</title>

    <link rel="apple-touch-icon" sizes="512x512" href="/icon-512.png">
    <link rel="icon" href="/icon-512.png" type="image/png">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#000000">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;400;700;900&family=Noto+Sans+JP:wght@400;700;900&family=Noto+Sans+Siddham&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <style>
        :root { --bg-color: #000000; --text-color: #FFFFFF; --accent-color: #FF3333; }
        
        html, body { margin: 0; padding: 0; width: 100%; height: calc(var(--vh, 1vh) * 100); position: fixed; background-color: var(--bg-color); color: var(--text-color); font-family: 'Inter', sans-serif; font-weight: 100; overflow: hidden; overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
        
        #webgl-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
        #bonji-bg { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-family: 'Noto Sans Siddham', sans-serif; font-size: 45dvh; color: transparent; -webkit-text-fill-color: transparent; -webkit-text-stroke: 1.7px var(--accent-color); text-shadow: none; filter: drop-shadow(0 0 6px var(--accent-color)) drop-shadow(0 0 18px var(--accent-color)); opacity: 0.30; z-index: 1; pointer-events: none; will-change: opacity; }
        #chakra-ring { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.5); width: clamp(240px, 75vw, 320px); height: clamp(240px, 75vw, 320px); border: 3px solid rgba(255,255,255,0.54); border-radius: 50%; box-shadow: 0 0 10px rgba(255,255,255,0.45), 0 0 23px var(--accent-color), 0 0 58px var(--accent-color), inset 0 0 17px var(--accent-color); z-index: 0; opacity: 0.84; pointer-events: none; will-change: transform, opacity; transition: transform 0.5s ease-out; }
        
        #ui-layer { position: relative; z-index: 3; display: flex; flex-direction: column; justify-content: space-between; align-items: center; height: calc(var(--vh, 1vh) * 100); padding-top: calc(env(safe-area-inset-top, 0px) + 12px); padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); padding-left: 5%; padding-right: 5%; box-sizing: border-box; background: linear-gradient(to bottom, rgba(0,0,0,0.46), transparent 31%, transparent 68%, rgba(0,0,0,0.75)); pointer-events: none; touch-action: none; }
        
        #ui-layer > * { pointer-events: auto; }
        header { flex: 0 0 auto; text-align: center; margin-top: 1dvh; }
        .title-main { font-family: 'Noto Sans JP', sans-serif; font-size: clamp(20px, 6vw, 26px); font-weight: 900; letter-spacing: 5px; color: #FFF; }
        .title-sub { font-family: 'Inter', sans-serif; font-size: clamp(9px, 3vw, 12px); font-weight: 400; letter-spacing: 6px; color: var(--accent-color); margin-top: 0.5vh; transition: color 0.5s; }
        
        #central-node { flex: 1 1 auto; display: flex; flex-direction: column; justify-content: center; align-items: center; width: 100%; position: relative; min-height: 0; padding-block: clamp(5px, 1.15dvh, 13px); box-sizing: border-box; }
        /* Ring remains above the overlay but below the central text. */
        #central-node > :not(#chakra-ring) { position: relative; z-index: 1; }
        .ruby-text { font-family: 'Noto Sans JP', sans-serif; font-weight: 900; font-size: clamp(16px, 5vw, 22px); letter-spacing: 6px; opacity: 0.8; height: 1.5em; display: flex; align-items: flex-end; justify-content: center; margin-bottom: -1dvh; }
        .kanji { font-family: 'Noto Sans JP', sans-serif; font-weight: 900; font-size: clamp(80px, 25dvh, 140px); color: var(--accent-color); transition: color 0.5s; height: 1.2em; display: flex; align-items: center; justify-content: center; margin-bottom: 1dvh; line-height: 1; }
        .on-guide { font-family: 'Inter', 'Noto Sans JP', sans-serif; font-size: clamp(18px, 6vw, 26px); letter-spacing: 4px; font-weight: 400; color: #EEE; height: 1.5em; display: flex; align-items: center; justify-content: center; }
        .note-display { font-size: clamp(14px, 4vw, 18px); font-weight: 700; font-family:'Inter', sans-serif; letter-spacing: 2px; color: #FFF; height: 1.5em; display: flex; align-items: center; justify-content: center; margin-top: 0.5vh; }
        
        #control-panel { flex: 0 0 auto; display: flex; flex-direction: column; gap: clamp(9px, 1.45dvh, 15px); background: rgba(15,15,19,0.38); border: 1px solid rgba(255,255,255,0.14); border-radius: 24px; padding: clamp(15px, 2dvh, 22px) clamp(16px, 5vw, 24px); box-sizing: border-box; text-align: center; width: 100%; max-width: 440px; margin: 0 auto; }
        #control-panel > * { margin-top: 0 !important; margin-bottom: 0 !important; }
        #meaning { font-size: clamp(12px, 3.5vw, 15px); opacity: 0.94; letter-spacing: 1px; color: #DDD; font-family: 'Noto Sans JP', sans-serif; line-height: 1.55; }
        #chakra-selector { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); align-items: center; justify-items: center; width: 100%; gap: clamp(3px, 1vw, 9px); }
        .chakra-btn { width: 100%; aspect-ratio: 1 / 1; max-width: 45px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.28); background: rgba(255,255,255,0.1); cursor: pointer; display: flex; justify-content: center; align-items: center; color: rgba(255,255,255,0.82); font-family: 'Inter', sans-serif; font-weight: 700; font-size: clamp(12px, 3.5vw, 16px); padding: 0; transition: all 0.2s;}
        .chakra-btn.active { border-color: #FFF; box-shadow: 0 0 10px rgba(255,255,255,0.5); transform: scale(1.1); color: #FFF; }
        #action-btn { background: rgba(0,0,0,0.8); border: 2px solid var(--accent-color); color: var(--accent-color); min-height: 44px; padding: clamp(9px, 1.6dvh, 15px) 10px; border-radius: 35px; font-size: clamp(16px, 5vw, 20px); font-family: 'Inter', sans-serif; letter-spacing: 3px; font-weight: 700; cursor: pointer; transition: all 0.2s; width: 100%; touch-action: none; }
        #action-btn:active { background-color: var(--accent-color); color: #000; transform: scale(0.97); }
        #debug-panel { display: flex; justify-content: space-between; gap: 2%; width: 100%; }
        .toggle-btn { flex: 1; min-width: 0; min-height: 42px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: #FFF; font-family: 'Inter', 'Noto Sans JP', sans-serif; font-size: clamp(9px, 2.5vw, 12px); line-height: 1.25; padding: 9px 5px; border-radius: 9px; cursor: pointer; transition: background-color 0.2s, border-color 0.2s; letter-spacing: 0.15px; touch-action: none; }
        .toggle-btn:active { background: rgba(255,255,255,0.3); }
        #debug-panel, #bottom-utilities { display: grid !important; grid-template-columns: repeat(3, minmax(0,1fr)); gap: clamp(6px, 1.6vw, 10px); width: 100%; }
        #audio-tools { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: clamp(6px, 1.6vw, 10px); width: 100%; }
        body.voice-mode #audio-tools { grid-template-columns: repeat(2, minmax(0,1fr)); }
        #control-panel .toggle-btn { width: 100%; }
        #ui-layer, #control-panel, #central-node, button, .chakra-btn, .toggle-btn { touch-action: none; }
        @media (max-height: 720px) {
            #ui-layer { padding-top: calc(env(safe-area-inset-top, 0px) + 7px); padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 7px); }
            #control-panel { gap: 7px; padding-block: 11px; }
            #control-panel .toggle-btn { min-height: 34px; padding-block: 6px; }
            #central-node { padding-block: 4px; }
        }
        #voice-panel[hidden] { display: none; }
        #voice-panel { display: flex; flex-direction: column; justify-content: center; align-items: center; width: min(94%, 410px); gap: clamp(10px, 1.8dvh, 19px); padding-block: clamp(6px, 1.2dvh, 14px); box-sizing: border-box; text-align: center; color: #fff; font-family: 'Inter', 'Noto Sans JP', sans-serif; }
        #voice-target-heading { font-size: clamp(12px, 2.7vw, 16px); letter-spacing: 2px; opacity: .8; }
        #voice-target-freq { font-size: clamp(17px, 4vw, 23px); color: var(--accent-color); font-weight: 700; }
        #voice-note { font-size: clamp(60px, 16vw, 94px); font-weight: 800; line-height: 1; letter-spacing: 1px; color: #fff; -webkit-text-stroke: 1.7px var(--voice-outline-color, #91A5BA); paint-order: stroke fill; text-shadow: 0 0 12px var(--voice-outline-color, #91A5BA), 0 0 27px var(--voice-outline-color, #91A5BA); transition: -webkit-text-stroke-color 0.24s ease, text-shadow 0.24s ease; }
        #voice-freq { font-size: clamp(18px, 4vw, 23px); font-variant-numeric: tabular-nums; }
        #voice-cents { font-size: clamp(15px, 3.5vw, 20px); font-variant-numeric: tabular-nums; }
        #voice-direction { font-size: 13px; min-height: 1.4em; opacity: .85; }
        #voice-meter { width: 100%; height: 52px; position: relative; }
        #voice-meter-track { position: absolute; height: 6px; top: 24px; left: 6%; right: 6%; border-radius: 6px; background: linear-gradient(90deg,#64748b 0%, #c7d2fe 42%, #53c7a9 50%, #c7d2fe 58%, #64748b 100%); }
        #voice-meter-track::after { content: ''; position: absolute; width: 2px; height: 19px; top: -7px; left: 50%; background: #fff; }
        #voice-needle { position: absolute; z-index: 2; left: 50%; top: 9px; width: 3px; height: 35px; background: #fff; border-radius: 4px; box-shadow: 0 0 9px #fff; transform: translateX(-50%); transition: left 95ms linear; }
        #voice-meter-low, #voice-meter-high { position: absolute; bottom: 0; font-size: 11px; opacity: .7; }
        #voice-meter-low { left: 3%; } #voice-meter-high { right: 3%; }
        #voice-level { height: 5px; background: rgba(255,255,255,.15); width: 75%; border-radius: 5px; overflow: hidden; }
        #voice-level-fill { height: 100%; background: var(--accent-color); width: 0; transition: width 90ms linear; }
        #voice-status { min-height: 2em; font-size: 12px; opacity: .88; }
        #btn-guide, #btn-mic-gain, #btn-voice-smoothing { display: none; }
        #voice-options { display: none; grid-template-columns: repeat(3, minmax(0,1fr)); gap: clamp(6px, 1.6vw, 10px); width: 100%; }
        #voice-options .toggle-btn { min-height: 42px; }
        body.voice-mode #voice-options { display: grid; }
        body.voice-mode #bonji-bg, body.voice-mode #chakra-ring, body.voice-mode #yomi-display,
        body.voice-mode #kanji-display, body.voice-mode #on-display, body.voice-mode #note-display,
        body.voice-mode #meaning, body.voice-mode #action-btn, body.voice-mode #debug-panel,
        body.voice-mode #bottom-utilities, body.voice-mode #btn-sound { display: none !important; }
        body.voice-mode #btn-guide, body.voice-mode #btn-mic-gain, body.voice-mode #btn-voice-smoothing { display: block; }
        body.voice-mode #control-panel { background: rgba(12,12,18,.66); gap: clamp(12px, 2dvh, 19px); padding-block: clamp(18px, 2.5dvh, 26px); }
        body.voice-mode #chakra-selector .chakra-btn { font-size: clamp(14px, 4vw, 19px); }
        button:disabled { opacity: 0.45; cursor: not-allowed; }
        #toast-msg { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 12px); left: 50%; transform: translateX(-50%) translateY(-100px); background: rgba(255,255,255,0.95); color: #000; padding: 12px 24px; border-radius: 20px; font-weight: 700; font-family: 'Noto Sans JP', sans-serif; font-size: 13px; z-index: 9999; transition: all 0.4s; opacity: 0; pointer-events: none; }
        /* Rin Player-inspired PWA update dialog, with iPhone safe-area spacing. */
        #update-modal { position: fixed; z-index: 10020; inset: 0; display: flex; align-items: center; justify-content: center; padding: calc(env(safe-area-inset-top, 0px) + 20px) 20px calc(env(safe-area-inset-bottom, 0px) + 20px); box-sizing: border-box; background: rgba(0,0,0,0.68); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
        #update-modal[hidden] { display: none; }
        #update-modal-box { width: min(100%, 360px); box-sizing: border-box; border-radius: 22px; padding: 26px 22px 22px; background: rgba(23,24,34,0.96); border: 1px solid rgba(255,255,255,0.22); color: #fff; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.65); font-family: 'Noto Sans JP', sans-serif; }
        #update-modal-icon { font-size: 29px; color: var(--accent-color); line-height: 1.4; min-height: 44px; }
        #update-modal-icon.checking { width: 27px; height: 27px; min-height: 0; border: 3px solid rgba(255,255,255,0.24); border-top-color: var(--accent-color); border-radius: 50%; margin: 5px auto 12px; animation: update-spin .8s linear infinite; }
        @keyframes update-spin { to { transform: rotate(360deg); } }
        #update-modal-title { font-size: 17px; font-weight: 700; margin: 10px 0; letter-spacing: 0.04em; }
        #update-modal-message { font-size: 12px; line-height: 1.75; color: rgba(255,255,255,0.75); margin: 0; }
        #update-modal-actions { display: flex; gap: 10px; margin-top: 20px; }
        #update-modal-actions[hidden] { display: none; }
        #update-modal-actions button { flex: 1; min-height: 44px; border: 1px solid rgba(255,255,255,0.23); border-radius: 12px; background: rgba(255,255,255,0.12); color: #fff; font-size: 13px; font-weight: 700; cursor: pointer; padding: 10px; touch-action: none; }
        #update-button-apply { background: var(--accent-color) !important; color: #000 !important; border-color: transparent !important; }
        #update-modal-actions button[hidden] { display: none; }
        #update-recovery-help { margin: 14px 0 0; font-size: 11px; color: rgba(255,255,255,.65); }
        #update-recovery-help[hidden] { display: none; }
        #update-recovery-help a { color: #a2e0e5; text-decoration: underline; text-underline-offset: 3px; touch-action: manipulation; }
        @media (prefers-reduced-motion: reduce) { #update-modal-icon.checking { animation: none; } }
    </style>
</head>
<body>
    <div id="toast-msg"></div>
    <div id="webgl-container"></div>
    <div id="bonji-bg">𑖀</div>
    <div id="ui-layer">
        <header>
            <div class="title-main">言霊チューナー</div>
            <div class="title-sub">CHAKRA TUNER</div>
        </header>
        <div id="central-node">
            <div id="chakra-ring"></div>
            <div id="yomi-display" class="ruby-text">ち</div>
            <div id="kanji-display" class="kanji">地</div>
            <div id="on-display" class="on-guide">ア / [ a ]</div>
            <div id="note-display" class="note-display">C3 (ド) / 131Hz</div>
            <section id="voice-panel" hidden aria-label="音声チューナー">
                <div id="voice-target-heading"><span id="voice-target-mode-label">自動判定</span> <strong id="voice-target-note">—</strong></div>
                <div id="voice-target-freq">130.8 Hz</div>
                <div id="voice-note">—</div>
                <div id="voice-freq">声を出してください</div>
                <div id="voice-cents">±0 cent</div>
                <div id="voice-meter" aria-label="目標音からのずれ">
                    <div id="voice-meter-track"></div>
                    <div id="voice-needle"></div>
                    <span id="voice-meter-low">低い −50</span>
                    <span id="voice-meter-high">+50 高い</span>
                </div>
                <div id="voice-direction">目標音に合わせて声を出してください</div>
                <div id="voice-level"><div id="voice-level-fill"></div></div>
                <div id="voice-status" aria-live="polite">マイク未使用</div>
            </section>
        </div>
        <div id="control-panel">
            <div id="meaning">土 / 基盤 / 生命 / 会陰</div>
            <div id="voice-options">
                <button id="btn-voice-mode" class="toggle-btn" type="button">フリー</button>
                <button id="btn-voice-notation" class="toggle-btn" type="button">表示: ドレミ</button>
                <button id="btn-voice-octave" class="toggle-btn" type="button" disabled>音域: 自動</button>
            </div>
            <div id="chakra-selector"></div>
            <button id="action-btn">TUNING START</button>
            <div id="debug-panel">
                <button id="btn-vis" class="toggle-btn">VIS: 統合3D</button>
                <button id="btn-tune" class="toggle-btn">TUNE: 基本</button>
                <button id="btn-breath" class="toggle-btn">呼吸: 8秒</button>
            </div>
            <div id="bottom-utilities" style="display: flex; justify-content: center; width: 100%; gap: 2%; margin-top: 2dvh;">
                <button id="btn-check-update" class="toggle-btn" style="flex: 1;" onclick="checkForUpdate()">UPDATE</button>
                <button id="btn-timer-display" class="toggle-btn" style="flex: 1; background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.3);" onclick="cycleTimer()">TIMER: OFF</button>
                <button id="btn-boost" class="toggle-btn" style="flex: 1;">BOOST: ON</button>
            </div>
            <div id="audio-tools">
                <button id="btn-sound" class="toggle-btn" type="button" aria-label="音源を切り替える">音源: 三角波</button>
                <button id="btn-voice" class="toggle-btn" type="button" aria-label="ボイスチューナーを起動">VOICE: START</button>
                <button id="btn-guide" class="toggle-btn" type="button" disabled>ガイド音を鳴らす</button>
                <button id="btn-mic-gain" class="toggle-btn" type="button" aria-label="マイク感度を切り替える">感度 ×8</button>
                <button id="btn-voice-smoothing" class="toggle-btn" type="button" aria-label="音程表示の追従速度を切り替える">追従: 安定</button>
            </div>
        </div>
    </div>

    <div id="update-modal" hidden role="dialog" aria-modal="true" aria-labelledby="update-modal-title" aria-describedby="update-modal-message">
        <div id="update-modal-box">
            <div id="update-modal-icon" aria-hidden="true"></div>
            <h2 id="update-modal-title">アップデート</h2>
            <p id="update-modal-message" aria-live="polite"></p>
            <div id="update-modal-actions" hidden>
                <button id="update-button-close" type="button">閉じる</button>
                <button id="update-button-apply" type="button" hidden>更新する</button>
            </div>
            <p id="update-recovery-help" hidden><a href="./update-recovery.html">更新できない場合の修復</a></p>
        </div>
    </div>

<script>
    function setFillHeight() {
        const vh = window.innerHeight * 0.01;
        document.documentElement.style.setProperty('--vh', `${vh}px`);
    }
    setFillHeight();

    // iOS Safari / home-screen PWA: disable accidental pinch and smart zoom.
    // Preserve rapid repeated taps on real controls.
    function blockViewportZoom(event) {
        if (event.cancelable) event.preventDefault();
    }
    for (const type of ['gesturestart', 'gesturechange']) {
        document.addEventListener(type, blockViewportZoom, { passive: false });
    }
    document.addEventListener('touchmove', event => {
        if (event.touches && event.touches.length > 1) blockViewportZoom(event);
    }, { passive: false });

    let lastBackgroundTap = null;
    document.addEventListener('touchend', event => {
        if (!event.changedTouches || event.changedTouches.length !== 1 ||
            (event.touches && event.touches.length !== 0)) {
            lastBackgroundTap = null;
            return;
        }
        const target = event.target;
        if (target && target.closest &&
            target.closest('button, a, input, select, textarea, label')) {
            lastBackgroundTap = null;
            return;
        }
        const touch = event.changedTouches[0];
        const now = performance.now();
        if (lastBackgroundTap && now - lastBackgroundTap.time < 320 &&
            Math.hypot(touch.clientX - lastBackgroundTap.x,
                       touch.clientY - lastBackgroundTap.y) < 30) {
            blockViewportZoom(event);
            lastBackgroundTap = null;
        } else {
            lastBackgroundTap = { time: now, x: touch.clientX, y: touch.clientY };
        }
    }, { passive: false });
    document.addEventListener('touchcancel', () => {
        lastBackgroundTap = null;
    }, { passive: true });
    window.addEventListener('resize', setFillHeight);
    window.addEventListener('orientationchange', () => {
        setTimeout(setFillHeight, 100);
        setTimeout(setFillHeight, 500); 
    });

    const chakraData = [
        { id: 1, kanji: "地", yomi: "ち",       on: "ア", phonetic: "a", note: "C3", solfege: "ド",  color: 0xFF3333, strColor: "#FF3333", bonji: "𑖀",     meaning: "土 / 基盤 / 生命 / 会陰" },
        { id: 2, kanji: "海", yomi: "うみ",     on: "ウ", phonetic: "u", note: "D3", solfege: "レ",  color: 0xFF8C00, strColor: "#FF8C00", bonji: "𑖪",     meaning: "水 / 創造 / 感情 / 丹田" },
        { id: 3, kanji: "陽", yomi: "よう",     on: "オ", phonetic: "o", note: "E3", solfege: "ミ",  color: 0xFFD700, strColor: "#FFD700", bonji: "𑖨",     meaning: "火 / 意志 /活力 / みぞおち" },
        { id: 4, kanji: "和", yomi: "わ",       on: "オ", phonetic: "o", note: "F3", solfege: "ファ",color: 0x00CC66, strColor: "#00CC66", bonji: "𑖮",     meaning: "風 / 調和 / 愛 / 胸" },
        { id: 5, kanji: "響", yomi: "ひびき",   on: "エ", phonetic: "e", note: "G3", solfege: "ソ",  color: 0x00BFFF, strColor: "#00BFFF", bonji: "𑖏",     meaning: "空 / 表現 / 空間 / 喉" },
        { id: 6, kanji: "理", yomi: "ことわり",  on: "イ", phonetic: "i", note: "A3", solfege: "ラ",  color: 0x4169E1, strColor: "#4169E1", bonji: "𑖌",     meaning: "識 / 直感 / 叡智 / 眉間" },
        { id: 7, kanji: "宙", yomi: "そら",     on: "ン", phonetic: "m", note: "B3", solfege: "シ",  color: 0xEE82EE, strColor: "#EE82EE", bonji: "𑖮𑖳𑖽",  meaning: "(吽) / 統合 / 超越 / 頭頂" }
    ];

    const solfeggioFreqs = [396, 417, 528, 639, 741, 852, 963];
    let currentChakraIndex = 0;
    let isTuning = false; let isStopping = false; let visMode = 2; let tuningMode = 0; let breathMode = 0;
    let tuneStartTime = 0; let shaderAccumulatedTime = 0; let lastRenderRealTime = 0; let rafId = null;
    let stopStartTime = 0;

    let timerDuration = 0;
    let timerSessionStartTime = 0;
    const timerSteps = [0, 5, 10, 20, 30, 40, 50, 60];
    let timerStepIdx = 0;
    let lastTimerStr = "";

    const ua = navigator.userAgent.toLowerCase();
    const isSmartPhone = /iphone|ipod|android.*mobile|windows.*phone/.test(ua);
    const isIPad = /ipad/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    const isWindows = /Windows/.test(navigator.userAgent);
    const isIPhone = /iPhone/.test(navigator.userAgent);

    let TARGET_FPS = 60;
    if (isSmartPhone) TARGET_FPS = 24;
    else if (isIPad) TARGET_FPS = 30;
    const FRAME_INTERVAL = 1000 / TARGET_FPS;
    let lastDrawTime = 0;

    let boostOn = true;
    function getTargetVolume() {
        const base = isWindows ? -12 : -3;
        // BOOST starts +9dB above the base level (+3dB versus the previous build).
        // The final master limiter protects against excessive signal peaks.
        return boostOn ? base + 9 : base - 20;
    }

    const bonjiEl = document.getElementById('bonji-bg');
    const ringEl  = document.getElementById('chakra-ring');
    const timerEl = document.getElementById('btn-timer-display');

    function showToast(msg) {
        const t = document.getElementById('toast-msg');
        t.innerText = msg;
        t.style.opacity = 1; t.style.transform = 'translateX(-50%) translateY(0)';
        setTimeout(() => { t.style.opacity = 0; t.style.transform = 'translateX(-50%) translateY(-100px)'; }, 3000);
    }

    function cycleTimer() {
        if (isTuning) return;
        timerStepIdx = (timerStepIdx + 1) % timerSteps.length;
        timerDuration = timerSteps[timerStepIdx];
        updateTimerDisplay();
    }

    function updateTimerDisplay() {
        timerEl.innerText = timerDuration === 0 ? "TIMER: OFF" : "TIMER: " + timerDuration + "分";
    }

    // ★修正箇所：グローバルにあったToneの設定を削除し、全て initAudio 関数の中に移動しました。

    let limiter, reverb, delay, lpf, hpf, env, sessionVolume;
    let audioInitialized = false;
    let osc = null;
    let samplePlayer = null;
    let dryGain = null;
    let padBuffer = null;
    let soundModeIndex = 0; // 0: legacy triangle+FX, 1: clean sine, 2: pre-rendered soft pad
    const SOUND_NAMES = ['三角波', '正弦波', 'シンセ'];

    function initAudio() {
        if (audioInitialized) return;
        
        // ★ユーザーがボタンを押した「直後」に初めて設定を行う（ここでContextが安全に作られる）
        Tone.context.lookAhead = 0.02;
        Tone.context.latencyHint = "interactive";

        // New output chain for each playback session. Do not reuse previous FX tails.
        // Gain before limiter; master BOOST cannot bypass the output limiter.
        limiter = new Tone.Limiter(-1).toDestination();
        sessionVolume = new Tone.Volume(getTargetVolume()).connect(limiter);
        dryGain = new Tone.Gain(0).connect(sessionVolume); // FXを通さない音源比較用
        reverb = new Tone.Freeverb({ roomSize: 0.35, dampening: 4500 }).connect(sessionVolume);
        delay = new Tone.PingPongDelay({ delayTime: 0.35, feedback: 0.05, wet: 0.1 }).connect(reverb);
        lpf = new Tone.Filter({ frequency: 8000, type: "lowpass", rolloff: -12 }).connect(delay);
        hpf = new Tone.Filter({ frequency: 150, type: "highpass", rolloff: -24 }).connect(lpf);
        env = new Tone.AmplitudeEnvelope({ attack: 0.25, decay: 0, sustain: 1, release: 0.30 }).connect(hpf);
        
        audioInitialized = true;
    }

    function disposeAudioChain() {
        // Reverb/delay keep an internal tail: dispose all nodes before the next start.
        for (const node of [env, hpf, lpf, delay, reverb, dryGain, limiter, sessionVolume]) {
            if (node) {
                try { node.dispose(); } catch (error) { console.warn('Audio cleanup:', error); }
            }
        }
        env = hpf = lpf = delay = reverb = dryGain = limiter = sessionVolume = null;
        audioInitialized = false;
    }

    // 220Hzの整数周期から短いループを一度だけ作り、Tone.Playerで繰り返す。
    // 外部サンプル音源は不要。ピッチはplaybackRateで制御する。
    function makePadBuffer() {
        const ctx = Tone.getContext().rawContext || Tone.getContext()._context;
        const cycles = 64, rate = ctx.sampleRate;
        const length = Math.round(rate * cycles / 220);
        const buffer = ctx.createBuffer(1, length, rate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < length; i++) {
            const phase = 2 * Math.PI * cycles * i / length;
            data[i] = 0.55 * Math.sin(phase) + 0.12 * Math.sin(2 * phase) + 0.03 * Math.sin(3 * phase);
        }
        return buffer;
    }

    function createOsc(freq) {
        destroyOsc();
        if (!env) initAudio();
        if (soundModeIndex === 2) {
            if (!padBuffer) padBuffer = makePadBuffer();
            samplePlayer = new Tone.Player({
                url: padBuffer, loop: true, volume: -3, fadeIn: 0.06, fadeOut: 0.12
            }).connect(dryGain);
            samplePlayer.playbackRate = freq / 220;
            samplePlayer.start();
            dryGain.gain.rampTo(1, 0.10);
        } else {
            const clean = soundModeIndex === 1;
            osc = new Tone.Oscillator({
                type: clean ? 'sine' : 'triangle',
                frequency: freq,
                volume: clean ? -9 : -8
            }).connect(clean ? dryGain : env);
            osc.start();
            if (clean) dryGain.gain.rampTo(1, 0.10);
        }
    }

    function destroyOsc() {
        if (osc) {
            try { osc.stop(); osc.dispose(); } catch(e) {}
            osc = null;
        }
        if (samplePlayer) {
            try { samplePlayer.stop(); samplePlayer.dispose(); } catch(e) {}
            samplePlayer = null;
        }
    }

    let renderer, scene, camera, particleSystem, material;

    function initThree() {
        if (renderer) return;
        const container = document.getElementById('webgl-container');
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
        camera.position.z = 400;

        renderer = new THREE.WebGLRenderer({ alpha: true, antialias: false, powerPreference: "low-power" });
        renderer.setSize(window.innerWidth, window.innerHeight);

        const count      = isIPhone ? 230 : 250;
        const pixelRatio = isIPhone ? 0.4  : 0.5;
        renderer.setPixelRatio(pixelRatio);
        container.appendChild(renderer.domElement);

        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(count * 3);
        const indices   = new Float32Array(count);
        for (let i = 0; i < count; i++) indices[i] = i / count;
        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('aIndex',   new THREE.BufferAttribute(indices, 1));

        material = new THREE.ShaderMaterial({
            uniforms: {
                uTime:     { value: 0 },
                uPulse:    { value: 0 },
                uColor:    { value: new THREE.Color(0xffffff) },
                uChakraId: { value: 1 },
                uVisMode:  { value: 2 },
                uOpacity:  { value: 0 }
            },
            vertexShader: `
                precision lowp float;
                uniform float uTime, uPulse, uChakraId, uVisMode;
                attribute float aIndex;
                void main() {
                    float isOuter = step(0.5, aIndex);
                    float dir = isOuter == 1.0 ? -1.0 : 1.0;
                    float t = fract(aIndex * 2.0) * 6.2831853;
                    float S = (150.0 + uPulse * 40.0) * (isOuter == 1.0 ? 1.25 : 0.75);
                    vec3 pos;
                    if(uVisMode < 0.5){ pos = vec3(sin(uChakraId * t + uTime * 0.5 * dir) * S, cos(t * (uChakraId + 1.0)) * S, 0.0); }
                    else if(uVisMode < 1.5){
                        float u = floor(fract(aIndex * 2.0) * 20.0) * (6.283 / 20.0) + uTime * 0.2 * dir;
                        float v = fract(aIndex * 40.0) * 6.283 + uTime * 0.3;
                        float R = S * 0.8, r = S * 0.4;
                        pos = vec3((R + r * cos(v)) * cos(u), (R + r * cos(v)) * sin(u), r * sin(v));
                    } else {
                        float u = uChakraId * t * 4.0 + uTime * 0.1 * dir;
                        float v = (uChakraId + 2.0) * t * 4.0 + uTime * 0.2;
                        float r = S * 0.5, rc = S * 0.9 + r * cos(v);
                        pos = vec3(rc * cos(u), rc * sin(u) * sin(v), r * sin(v));
                    }
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
                    gl_PointSize = (${isIPhone ? '2.0' : '2.5'} + uPulse * 2.5) * (isOuter == 1.0 ? 0.7 : 1.3);
                }
            `,
            fragmentShader: `
                precision lowp float;
                uniform vec3 uColor; uniform float uOpacity;
                void main() {
                    if (dot(gl_PointCoord-0.5, gl_PointCoord-0.5) > 0.25) discard;
                    gl_FragColor = vec4(uColor, uOpacity);
                }
            `,
            transparent: true, blending: THREE.AdditiveBlending, depthWrite: false
        });
        particleSystem = new THREE.Points(geometry, material);
        scene.add(particleSystem);
    }

    window.addEventListener('resize', () => {
        if (!renderer) return;
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function getFreq() {
        const data = chakraData[currentChakraIndex];
        if (tuningMode === 2) return solfeggioFreqs[currentChakraIndex];
        // Tone.Frequency自体はContextが無くても計算できるため安全
        return Tone.Frequency(data.note).transpose(tuningMode * 12).toFrequency();
    }

    function updateAudioAndUI() {
        const data = chakraData[currentChakraIndex];
        document.getElementById('kanji-display').innerText = data.kanji;
        document.getElementById('yomi-display').innerText = data.yomi;
        bonjiEl.innerText = data.bonji;
        document.getElementById('on-display').innerText = data.on + " / [ " + data.phonetic + " ]";
        document.getElementById('meaning').innerText = data.meaning;
        document.documentElement.style.setProperty('--accent-color', data.strColor);

        document.querySelectorAll('.chakra-btn').forEach((btn, idx) => {
            if (idx === currentChakraIndex) {
                btn.classList.add('active');
                btn.style.backgroundColor = data.strColor;
                btn.style.boxShadow = "0 0 10px " + data.strColor;
            } else {
                btn.classList.remove('active');
                btn.style.backgroundColor = 'rgba(255,255,255,0.1)';
                btn.style.boxShadow = 'none';
            }
        });

        let freq = getFreq();
        if (tuningMode === 2) {
            document.getElementById('note-display').innerText = "ソルフェジオ / " + freq + "Hz";
        } else {
            const baseNote = Tone.Frequency(data.note).transpose(tuningMode * 12).toNote().toUpperCase();
            document.getElementById('note-display').innerText = baseNote + " (" + data.solfege + ") / " + Math.round(freq) + "Hz";
        }

        if (material) {
            material.uniforms.uColor.value.setHex(data.color);
            material.uniforms.uChakraId.value = data.id;
        }
        if (isTuning && !isStopping) {
            if (osc) osc.frequency.rampTo(freq, 0.055);
            if (samplePlayer) samplePlayer.playbackRate = freq / 220;
        }
        if (window.kotodamaVoiceTuner) window.kotodamaVoiceTuner.setTarget(window.kotodamaGetVoiceTarget());
    }

    const actionBtn = document.getElementById('action-btn');

    async function stopTuning() {
        if (isStopping) return;
        isStopping = true;
        actionBtn.disabled = true;
        actionBtn.innerText = "RESETTING...";
        stopStartTime = performance.now();

        try {
            if (env) env.triggerRelease();
            if (dryGain) dryGain.gain.rampTo(0, 0.18);
            if (sessionVolume) sessionVolume.volume.rampTo(-65, 0.22);

            await new Promise(resolve => setTimeout(resolve, 290));

            stopLoop();
            destroyOsc();
            disposeAudioChain();

            if (renderer) {
                renderer.dispose();
                const container = document.getElementById('webgl-container');
                if (container && container.contains(renderer.domElement)) {
                    container.removeChild(renderer.domElement);
                }
                renderer = null;
                material = null;
                scene = null;
                particleSystem = null;
            }

            // Keep the context running until iOS actually backgrounds the page.
            // Avoid suspend/resume cycles on each sound change.
        } catch (e) {
            console.error("Cleanup error:", e);
        } finally {
            stopLoop();
            destroyOsc();
            disposeAudioChain();
            isTuning = false;
            isStopping = false;
            actionBtn.disabled = false;
            actionBtn.innerText = "TUNING START";

            lastTimerStr = "";

            bonjiEl.style.opacity = '0.30';
            ringEl.style.transform = 'translate(-50%, -50%) scale(0.5)';

            if (timerEl) {
                timerEl.style.opacity = '1.0';
                timerEl.style.pointerEvents = 'auto';
            }
            updateTimerDisplay();
            updateAudioAndUI();
        }
    }

    async function toggleTuning() {
        if (isStopping) return;
        if (!isTuning) {
            isTuning = true;
            actionBtn.innerText = "TUNING STOP";

            timerEl.style.opacity = '0.5';
            timerEl.style.pointerEvents = 'none';

            // ボタンクリック時、真っ先にToneを開始
            if (Tone.context.state !== 'running') {
                await Tone.start();
            }
            initAudio();

            // Only the current session volume controls playback loudness.
            // No global Destination fade remains from the previous mode.
            initThree();
            createOsc(getFreq());
            updateAudioAndUI();
            if (soundModeIndex === 0) env.triggerAttack();
            tuneStartTime = lastRenderRealTime = performance.now();
            timerSessionStartTime = performance.now();
            startLoop();
        } else {
            await stopTuning();
        }
    }

    function startLoop() { if (!rafId) rafId = requestAnimationFrame(loop); }
    function stopLoop() { if (rafId) { cancelAnimationFrame(rafId); rafId = null; } }

    function loop() {
        if (!isTuning) return;
        rafId = requestAnimationFrame(loop);

        const now = performance.now();
        const elapsedSinceLastDraw = now - lastDrawTime;
        if (elapsedSinceLastDraw < FRAME_INTERVAL) return;
        lastDrawTime = now - (elapsedSinceLastDraw % FRAME_INTERVAL);

        if (!renderer || !material) return;

        if (timerDuration > 0 && !isStopping) {
            const elapsedSec = (now - timerSessionStartTime) / 1000;
            const totalSec   = timerDuration * 60;
            const remaining  = Math.max(0, totalSec - elapsedSec);

            const m = Math.floor(remaining / 60);
            const s = Math.floor(remaining % 60);
            const timerStr = m + ":" + (s < 10 ? "0" : "") + s;
            if (timerStr !== lastTimerStr) {
                timerEl.innerText = timerStr;
                lastTimerStr = timerStr;
            }

            if (remaining <= 0) {
                stopTuning();
                return;
            }
        }

        let alpha = isStopping ? Math.max(0, 1.0 - (now - stopStartTime) / 2000) : 1.0;
        const elapsed = (now - tuneStartTime) * 0.001;

        const halfBreath = breathMode === 0 ? 4.0 : 8.0;
        const holdSec    = 1.0;
        const period     = halfBreath * 2 + holdSec * 2;
        const t          = elapsed % period;

        let pulse = 0;
        if (t <= holdSec) {
            pulse = 0.0;
        } else if (t > holdSec && t <= holdSec + halfBreath) {
            pulse = (1.0 - Math.cos(((t - holdSec) / halfBreath) * Math.PI)) * 0.5;
        } else if (t > holdSec + halfBreath && t <= holdSec * 2 + halfBreath) {
            pulse = 1.0;
        } else {
            pulse = (1.0 + Math.cos(((t - (holdSec * 2 + halfBreath)) / halfBreath) * Math.PI)) * 0.5;
        }

        shaderAccumulatedTime += Math.min((now - lastRenderRealTime) * 0.001, 0.1);
        lastRenderRealTime = now;
        material.uniforms.uTime.value    = shaderAccumulatedTime;
        material.uniforms.uPulse.value   = pulse;
        material.uniforms.uOpacity.value = (0.75 + 0.10 * pulse) * alpha;

        // Follow the breath from 30% to 100% opacity; fade separately on stop.
        bonjiEl.style.opacity  = (0.30 + pulse * 0.70) * alpha;
        ringEl.style.transform = "translate(-50%, -50%) scale(" + (0.5 + pulse * 0.5) + ")";
        renderer.render(scene, camera);
    }

    chakraData.forEach((c, i) => {
        const b = document.createElement('button');
        b.className = 'chakra-btn';
        b.innerText = c.id;
        b.onclick = () => {
            if (window.kotodamaVoiceTuner?.active && window.kotodamaVoiceTuner.mode === 'free') return;
            currentChakraIndex = i;
            updateAudioAndUI();
        };
        document.getElementById('chakra-selector').appendChild(b);
    });

    actionBtn.onclick = toggleTuning;
    // 音源変更は停止中のみ許可して急な切替ノイズを避ける。
    document.getElementById('btn-sound').onclick = () => {
        if (isTuning || isStopping) { showToast('音を停止してから切り替えてください'); return; }
        soundModeIndex = (soundModeIndex + 1) % SOUND_NAMES.length;
        document.getElementById('btn-sound').innerText = '音源: ' + SOUND_NAMES[soundModeIndex];
        showToast(SOUND_NAMES[soundModeIndex] + ' に切り替えました');
    };
    window.kotodamaSoundIsRunning = () => isTuning || isStopping;
    // VOICEは基本音階C3〜B3に固定し、瞑想側の+1・ソルフェ設定を変更しない。
    window.kotodamaGetVoiceTarget = () => Tone.Frequency(chakraData[currentChakraIndex].note).toFrequency();
    window.kotodamaSetVoiceLabels = (active, notation = 'solfege') => {
        const names = notation === 'solfege'
            ? ['ド', 'レ', 'ミ', 'ファ', 'ソ', 'ラ', 'シ']
            : ['C', 'D', 'E', 'F', 'G', 'A', 'B'];
        document.querySelectorAll('#chakra-selector .chakra-btn').forEach((btn, index) => {
            btn.innerText = active ? names[index] : String(chakraData[index].id);
            btn.setAttribute('aria-label', active ? '音階 ' + names[index] : 'チャクラ ' + chakraData[index].id);
        });
    };
    window.kotodamaSetVoiceSelection = selectedIndex => {
        document.querySelectorAll('#chakra-selector .chakra-btn').forEach((btn, index) => {
            const selected = index === selectedIndex;
            btn.classList.toggle('active', selected);
            btn.style.backgroundColor = selected ? chakraData[index].strColor : 'rgba(255,255,255,0.1)';
            btn.style.boxShadow = selected ? '0 0 10px ' + chakraData[index].strColor : 'none';
        });
    };
    window.kotodamaStopSound = async () => {
        if (isTuning || isStopping) {
            if (isStopping) return;
            await stopTuning();
        }
    };

    document.getElementById('btn-vis').onclick = () => {
        visMode = (visMode + 1) % 3;
        document.getElementById('btn-vis').innerText = ['VIS: 2D','VIS: 3D','VIS: 統合3D'][visMode];
        if (material) material.uniforms.uVisMode.value = visMode;
    };
    document.getElementById('btn-tune').onclick = () => {
        tuningMode = (tuningMode + 1) % 3;
        document.getElementById('btn-tune').innerText = ['TUNE: 基本','TUNE: +1','TUNE: ソルフェ'][tuningMode];
        updateAudioAndUI();
    };
    document.getElementById('btn-breath').onclick = () => {
        breathMode = (breathMode + 1) % 2;
        document.getElementById('btn-breath').innerText = ['呼吸: 8秒','呼吸: 16秒'][breathMode];
    };

    document.getElementById('btn-boost').onclick = () => {
        boostOn = !boostOn;
        document.getElementById('btn-boost').innerText = boostOn ? 'BOOST: ON' : 'BOOST: OFF';
        if (isTuning && sessionVolume) {
            sessionVolume.volume.rampTo(getTargetVolume(), 0.20);
        }
    };

    // PWA update handling is in pwa-update.js.
    // VitePWA's injected registerSW.js is the sole service-worker registration.

    // ★修正箇所：ここでもバックグラウンド処理時に勝手にContextを作らないようガードを追加しました
    document.addEventListener('visibilitychange', () => {
        if (!audioInitialized) return; // ← 追加：まだスタート押してないなら無視
        const raw = Tone.getContext().rawContext;
        if (document.hidden) {
            if (raw && typeof raw.suspend === 'function' && raw.state === 'running') {
                raw.suspend().catch(() => {});
            }
        } else {
            if (raw && typeof raw.resume === 'function') {
                raw.resume().catch(() => {});
            }
        }
    });

    window.addEventListener('pagehide', () => {
        if (!audioInitialized) return; // ← 追加：まだスタート押してないなら無視
        destroyOsc();
        disposeAudioChain();
        const raw = Tone.getContext().rawContext;
        if (raw && typeof raw.suspend === 'function' && raw.state === 'running') {
            raw.suspend().catch(() => {});
        }
    });

    // 画面のUIだけ先にアップデートしておく
    updateAudioAndUI();

</script>
<script type="module" src="./voice-tuner.js"></script>
<script type="module" src="./pwa-update.js"></script>
</body>
</html>
