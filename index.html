<!DOCTYPE html>

<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="言霊チューナー">
    <title>言霊チューナー</title>

<link rel="apple-touch-icon" sizes="512x512" href="./icon-512.png">
<link rel="icon" href="./icon-512.png" type="image/png">
<link rel="manifest" href="./manifest.json">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;400;700;900&family=Noto+Sans+JP:wght@400;700;900&family=Noto+Sans+Siddham&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<style>
    :root { --bg-color: #000000; --text-color: #FFFFFF; --accent-color: #FF3333; }
    html, body { margin: 0; padding: 0; width: 100%; height: 100dvh; background-color: var(--bg-color); color: var(--text-color); font-family: 'Inter', sans-serif; font-weight: 100; overflow: hidden; touch-action: none; }
    #webgl-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
    #bonji-bg { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-family: 'Noto Sans Siddham', sans-serif; font-size: 45vh; color: rgba(0, 0, 0, 0.8); -webkit-text-stroke: 1px rgba(255, 255, 255, 0.3); text-shadow: 0 0 30px rgba(0,0,0,1), 0 0 20px var(--accent-color); opacity: 0.4; z-index: 1; pointer-events: none; will-change: opacity; transition: opacity 0.5s ease-out; }
    #chakra-ring { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.5); width: clamp(240px, 75vw, 320px); height: clamp(240px, 75vw, 320px); border: 4px solid rgba(255, 255, 255, 0.15); border-radius: 50%; box-shadow: 0 0 30px var(--accent-color); z-index: -1; opacity: 0.4; pointer-events: none; will-change: transform, opacity; transition: transform 0.5s ease-out; }
    #ui-layer { position: relative; z-index: 3; display: flex; flex-direction: column; justify-content: space-between; align-items: center; height: 100%; padding-top: calc(env(safe-area-inset-top, 5vh) + 2vh); padding-bottom: calc(env(safe-area-inset-bottom, 2vh) + 1vh); padding-left: 5%; padding-right: 5%; box-sizing: border-box; background: linear-gradient(to bottom, rgba(0,0,0,0.6), transparent 30%, transparent 70%, rgba(0,0,0,0.8)); pointer-events: none; }
    #ui-layer > * { pointer-events: auto; }
    header { flex: 0 0 auto; text-align: center; margin-top: 1vh; }
    .title-main { font-family: 'Noto Sans JP', sans-serif; font-size: clamp(20px, 6vw, 26px); font-weight: 900; letter-spacing: 5px; color: #FFF; }
    .title-sub { font-family: 'Inter', sans-serif; font-size: clamp(9px, 3vw, 12px); font-weight: 400; letter-spacing: 6px; color: var(--accent-color); margin-top: 0.5vh; transition: color 0.5s; }
    #central-node { flex: 1 1 auto; display: flex; flex-direction: column; justify-content: center; align-items: center; width: 100%; position: relative; min-height: 30vh; }
    .ruby-text { font-family: 'Noto Sans JP', sans-serif; font-weight: 900; font-size: clamp(16px, 5vw, 22px); letter-spacing: 6px; opacity: 0.8; height: 1.5em; display: flex; align-items: flex-end; justify-content: center; margin-bottom: -1vh; }
    .kanji { font-family: 'Noto Sans JP', sans-serif; font-weight: 900; font-size: clamp(100px, 30vw, 140px); color: var(--accent-color); transition: color 0.5s; height: 1.2em; display: flex; align-items: center; justify-content: center; margin-bottom: 1vh; line-height: 1; }
    .on-guide { font-family: 'Inter', 'Noto Sans JP', sans-serif; font-size: clamp(18px, 6vw, 26px); letter-spacing: 4px; font-weight: 400; color: #EEE; height: 1.5em; display: flex; align-items: center; justify-content: center; }
    .note-display { font-size: clamp(14px, 4vw, 18px); font-weight: 700; font-family:'Inter', sans-serif; letter-spacing: 2px; color: #FFF; height: 1.5em; display: flex; align-items: center; justify-content: center; margin-top: 0.5vh; }
    
    #control-panel { flex: 0 0 auto; background-color: rgba(15, 15, 15, 0.1); border: 1px solid rgba(255,255,255,0.1); border-radius: 24px; padding: 3% 5%; text-align: center; width: 100%; max-width: 400px; }
    #meaning { font-size: clamp(12px, 3.5vw, 15px); opacity: 0.9; margin-bottom: 1.5vh; letter-spacing: 1px; color: #CCC; font-family: 'Noto Sans JP', sans-serif;}
    #chakra-selector { display: flex; justify-content: space-between; width: 100%; gap: 2%; margin-bottom: 1.5vh; }
    .chakra-btn { flex: 1; aspect-ratio: 1 / 1; max-width: 45px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.1); cursor: pointer; display: flex; justify-content: center; align-items: center; color: rgba(255,255,255,0.7); font-family: 'Inter', sans-serif; font-weight: 700; font-size: clamp(12px, 3.5vw, 16px); padding: 0; transition: all 0.2s;}
    .chakra-btn.active { border-color: #FFF; box-shadow: 0 0 10px rgba(255,255,255,0.5); transform: scale(1.1); color: #FFF; }
    #action-btn { background: rgba(0,0,0,0.8); border: 2px solid var(--accent-color); color: var(--accent-color); padding: 1.5vh 5vw; border-radius: 35px; font-size: clamp(16px, 5vw, 20px); font-family: 'Inter', sans-serif; letter-spacing: 3px; font-weight: 700; cursor: pointer; transition: all 0.2s; width: 100%; margin-bottom: 1.5vh; touch-action: manipulation; }
    #action-btn:active { background-color: var(--accent-color); color: #000; transform: scale(0.97); }
    #debug-panel { display: flex; justify-content: space-between; gap: 2%; width: 100%; }
    .toggle-btn { flex: 1; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: #FFF; font-family: 'Inter', 'Noto Sans JP', sans-serif; font-size: clamp(8px, 2.2vw, 11px); padding: 1.2vh 0; border-radius: 8px; cursor: pointer; transition: all 0.2s; letter-spacing: 0.5px; touch-action: manipulation; }
    .toggle-btn:active { background: rgba(255,255,255,0.3); }
    #toast-msg { position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px); background: rgba(255,255,255,0.95); color: #000; padding: 12px 24px; border-radius: 20px; font-weight: 700; font-family: 'Noto Sans JP', sans-serif; font-size: 13px; z-index: 9999; transition: all 0.4s; opacity: 0; pointer-events: none; }
</style>

</head>
<body>
    <div id="toast-msg"></div>
    <div id="webgl-container"></div>
    <div id="bonji-bg">𑖀</div>
    <div id="ui-layer">
        <header>
            <div class="title-main">言霊チューナー</div>
            <div class="title-sub">CHAKRA TUNER</div>
        </header>
        <div id="central-node">
            <div id="chakra-ring"></div>
            <div id="yomi-display" class="ruby-text">ち</div>
            <div id="kanji-display" class="kanji">地</div>
            <div id="on-display" class="on-guide">ア / [ a ]</div>
            <div id="note-display" class="note-display">C3 (ド) / 131Hz</div>
        </div>
        <div id="control-panel">
            <div id="meaning">土 / 基盤 / 生命 / 会陰</div>
            <div id="chakra-selector"></div>
            <button id="action-btn">TUNING START</button>
            <div id="debug-panel">
                <button id="btn-vis" class="toggle-btn">VIS: 統合3D</button>
                <button id="btn-tune" class="toggle-btn">TUNE: 基本</button>
                <button id="btn-breath" class="toggle-btn">呼吸: 8秒</button>
            </div>
            <div style="display: flex; justify-content: center; width: 100%; gap: 10px; margin-top: 4vh;">
                <button id="btn-check-update" class="toggle-btn" style="flex: 1;" onclick="checkForUpdate()">UPDATE</button>
                <button id="btn-timer-display" class="toggle-btn" style="flex: 1; background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.3);" onclick="cycleTimer()">TIMER: OFF</button>
            </div>
        </div>
    </div>

<script>
    const chakraData = [
        { id: 1, kanji: "地", yomi: "ち",     on: "ア", phonetic: "a", note: "C3", solfege: "ド", color: 0xFF3333, strColor: "#FF3333", bonji: "𑖀",      meaning: "土 / 基盤 / 生命 / 会陰" },
        { id: 2, kanji: "海", yomi: "うみ",   on: "ウ", phonetic: "u", note: "D3", solfege: "レ", color: 0xFF8C00, strColor: "#FF8C00", bonji: "𑖪",      meaning: "水 / 創造 / 感情 / 丹田" },
        { id: 3, kanji: "陽", yomi: "よう",   on: "オ", phonetic: "o", note: "E3", solfege: "ミ", color: 0xFFD700, strColor: "#FFD700", bonji: "𑖨",      meaning: "火 / 意志 /活力 / みぞおち" },
        { id: 4, kanji: "和", yomi: "わ",     on: "オ", phonetic: "o", note: "F3", solfege: "ファ",color: 0x00CC66, strColor: "#00CC66", bonji: "𑖮",     meaning: "風 / 調和 / 愛 / 胸" },
        { id: 5, kanji: "響", yomi: "ひびき", on: "エ", phonetic: "e", note: "G3", solfege: "ソ", color: 0x00BFFF, strColor: "#00BFFF", bonji: "𑖏",      meaning: "空 / 表現 / 空間 / 喉" },
        { id: 6, kanji: "理", yomi: "ことわり",on: "イ", phonetic: "i", note: "A3", solfege: "ラ", color: 0x4169E1, strColor: "#4169E1", bonji: "𑖌",     meaning: "識 / 直感 / 叡智 / 眉間" },
        { id: 7, kanji: "宙", yomi: "そら",   on: "ン", phonetic: "m", note: "B3", solfege: "シ", color: 0xEE82EE, strColor: "#EE82EE", bonji: "𑖮𑖳𑖽", meaning: "(吽) / 統合 / 超越 / 頭頂" }
    ];

    const solfeggioFreqs = [396, 417, 528, 639, 741, 852, 963];
    let currentChakraIndex = 0;
    let isTuning = false; let isStopping = false; let visMode = 2; let tuningMode = 0; let breathMode = 0;
    let tuneStartTime = 0; let shaderAccumulatedTime = 0; let lastRenderRealTime = 0; let rafId = null;
    let stopStartTime = 0;

    let timerDuration = 0; 
    let timerSessionStartTime = 0;
    const timerSteps = [0, 5, 10, 20, 30, 40, 50, 60];
    let timerStepIdx = 0;
    let lastTimerStr = ""; // バッテリー対策（画面の無駄な更新を防ぐ）

    // デバイス別FPS制御（PC=60fps / iPad=30fps / スマホ=24fps）
    let TARGET_FPS = 60;
    const ua = navigator.userAgent.toLowerCase();
    const isSmartPhone = /iphone|ipod|android.*mobile|windows.*phone/.test(ua);
    const isIPad = /ipad/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    if (isSmartPhone) TARGET_FPS = 24;
    else if (isIPad) TARGET_FPS = 30;
    const FRAME_INTERVAL = 1000 / TARGET_FPS;
    let lastDrawTime = 0;

    function showToast(msg) {
        const t = document.getElementById('toast-msg');
        t.innerText = msg;
        t.style.opacity = 1; t.style.transform = 'translateX(-50%) translateY(0)';
        setTimeout(() => { t.style.opacity = 0; t.style.transform = 'translateX(-50%) translateY(-100px)'; }, 3000);
    }

    function cycleTimer() {
        if (isTuning) return; // ※音が鳴っている間はタイマー変更をロック（仕様）
        timerStepIdx = (timerStepIdx + 1) % timerSteps.length;
        timerDuration = timerSteps[timerStepIdx];
        updateTimerDisplay();
    }

    function updateTimerDisplay() {
        const btn = document.getElementById('btn-timer-display');
        btn.innerText = timerDuration === 0 ? "TIMER: OFF" : "TIMER: " + timerDuration + "分";
    }

    // --- Audio chain (スマホ最適化版) ---
    Tone.context.lookAhead = 0.5; 
    Tone.context.latencyHint = "playback";

    const limiter = new Tone.Limiter(-1).toDestination();
    const reverb = new Tone.Freeverb({ roomSize: 0.35, dampening: 4500 }).connect(limiter);
    const delay = new Tone.PingPongDelay({ delayTime: 0.35, feedback: 0.05, wet: 0.1 }).connect(reverb);
    const lpf = new Tone.Filter({ frequency: 8000, type: "lowpass", rolloff: -12 }).connect(delay);
    const hpf = new Tone.Filter({ frequency: 150, type: "highpass", rolloff: -24 }).connect(lpf);
    const env = new Tone.AmplitudeEnvelope({ attack: 1.5, decay: 0, sustain: 1, release: 2.5 }).connect(hpf);

    let osc = null;

    function createOsc(freq) {
        destroyOsc();
        osc = new Tone.Oscillator({ type: "triangle", frequency: freq, volume: -8 }).connect(env);
        osc.start();
    }

    function destroyOsc() {
        if (osc) {
            try { osc.stop(); osc.dispose(); } catch(e) {}
            osc = null;
        }
    }

    let renderer, scene, camera, particleSystem, material;

    function initThree() {
        if (renderer) return;
        const container = document.getElementById('webgl-container');
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
        camera.position.z = 400;
        renderer = new THREE.WebGLRenderer({ alpha: true, antialias: false, powerPreference: "low-power" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(0.5);
        container.appendChild(renderer.domElement);

        const count = 250;
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(count * 3);
        const indices = new Float32Array(count);
        for (let i = 0; i < count; i++) indices[i] = i / count;
        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('aIndex', new THREE.BufferAttribute(indices, 1));

        material = new THREE.ShaderMaterial({
            uniforms: { uTime: {value: 0}, uPulse: {value: 0}, uColor: {value: new THREE.Color(0xffffff)}, uChakraId: {value: 1}, uVisMode: {value: 2}, uOpacity: {value: 0} },
            vertexShader: `
                precision mediump float;
                uniform float uTime, uPulse, uChakraId, uVisMode;
                attribute float aIndex;
                void main() {
                    float isOuter = step(0.5, aIndex);
                    float dir = isOuter == 1.0 ? -1.0 : 1.0;
                    float t = fract(aIndex * 2.0) * 6.2831853;
                    float S = (150.0 + uPulse * 40.0) * (isOuter == 1.0 ? 1.25 : 0.75);
                    vec3 pos;
                    if(uVisMode < 0.5){ pos = vec3(sin(uChakraId * t + uTime * 0.5 * dir) * S, cos(t * (uChakraId + 1.0)) * S, 0.0); }
                    else if(uVisMode < 1.5){
                        float u = floor(fract(aIndex * 2.0) * 20.0) * (6.283 / 20.0) + uTime * 0.2 * dir;
                        float v = fract(aIndex * 40.0) * 6.283 + uTime * 0.3;
                        float R = S * 0.8, r = S * 0.4;
                        pos = vec3((R + r * cos(v)) * cos(u), (R + r * cos(v)) * sin(u), r * sin(v));
                    } else {
                        float u = uChakraId * t * 4.0 + uTime * 0.1 * dir;
                        float v = (uChakraId + 2.0) * t * 4.0 + uTime * 0.2;
                        float r = S * 0.5, rc = S * 0.9 + r * cos(v);
                        pos = vec3(rc * cos(u), rc * sin(u) * sin(v), r * sin(v));
                    }
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
                    gl_PointSize = (2.5 + uPulse * 2.5) * (isOuter == 1.0 ? 0.7 : 1.3);
                }
            `,
            fragmentShader: `
                precision mediump float;
                uniform vec3 uColor; uniform float uOpacity;
                void main() {
                    if (dot(gl_PointCoord-0.5, gl_PointCoord-0.5) > 0.25) discard;
                    gl_FragColor = vec4(uColor, uOpacity);
                }
            `,
            transparent: true, blending: THREE.AdditiveBlending, depthWrite: false
        });
        particleSystem = new THREE.Points(geometry, material);
        scene.add(particleSystem);

        window.addEventListener('resize', () => {
            if (!renderer) return;
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    }

    function getFreq() {
        const data = chakraData[currentChakraIndex];
        if (tuningMode === 2) return solfeggioFreqs[currentChakraIndex];
        return Tone.Frequency(data.note).transpose(tuningMode * 12).toFrequency();
    }

    function updateAudioAndUI() {
        const data = chakraData[currentChakraIndex];
        document.getElementById('kanji-display').innerText = data.kanji;
        document.getElementById('yomi-display').innerText = data.yomi;
        document.getElementById('bonji-bg').innerText = data.bonji;
        document.getElementById('on-display').innerText = data.on + " / [ " + data.phonetic + " ]";
        document.getElementById('meaning').innerText = data.meaning;
        document.documentElement.style.setProperty('--accent-color', data.strColor);

        document.querySelectorAll('.chakra-btn').forEach((btn, idx) => {
            if (idx === currentChakraIndex) {
                btn.classList.add('active');
                btn.style.backgroundColor = data.strColor;
                btn.style.boxShadow = "0 0 10px " + data.strColor;
            } else {
                btn.classList.remove('active');
                btn.style.backgroundColor = 'rgba(255,255,255,0.1)';
                btn.style.boxShadow = 'none';
            }
        });

        let freq = getFreq();
        if (tuningMode === 2) {
            document.getElementById('note-display').innerText = "ソルフェジオ / " + freq + "Hz";
        } else {
            const baseNote = Tone.Frequency(data.note).transpose(tuningMode * 12).toNote().toUpperCase();
            document.getElementById('note-display').innerText = baseNote + " (" + data.solfege + ") / " + Math.round(freq) + "Hz";
        }

        if (material) { 
            material.uniforms.uColor.value.setHex(data.color); 
            material.uniforms.uChakraId.value = data.id; 
        }
        if (isTuning && !isStopping && osc) {
            osc.frequency.rampTo(freq, 1.0);
        }
    }

    const actionBtn = document.getElementById('action-btn');

    async function stopTuning() {
        if (isStopping) return;
        isStopping = true;
        actionBtn.disabled = true;
        actionBtn.innerText = "RESETTING...";
        stopStartTime = performance.now();

        try {
            Tone.Destination.volume.cancelScheduledValues(Tone.now());
            env.triggerRelease();
            Tone.Destination.volume.rampTo(-60, 2.5);

            await new Promise(resolve => setTimeout(resolve, 3200));

            stopLoop();
            destroyOsc();
            if (Tone.context.state !== 'suspended') {
                await Tone.context.suspend();
            }

            if (renderer) {
                renderer.dispose();
                const container = document.getElementById('webgl-container');
                if(container.contains(renderer.domElement)) container.removeChild(renderer.domElement);
                renderer = null; material = null; scene = null;
            }
        } catch (e) {
            console.error("Cleanup failed:", e);
        } finally {
            isTuning = false; 
            isStopping = false;
            actionBtn.disabled = false;
            actionBtn.innerText = "TUNING START";
            Tone.Destination.volume.value = -3;
            
            document.getElementById('bonji-bg').style.opacity = '0.4';
            document.getElementById('chakra-ring').style.transform = 'translate(-50%, -50%) scale(0.5)';
            
            const timerBtn = document.getElementById('btn-timer-display');
            timerBtn.style.opacity = '1.0';
            timerBtn.style.pointerEvents = 'auto'; // ボタンのロック解除
            
            updateTimerDisplay(); // 停止時にタイマーの表示をリセット
        }
    }

    async function toggleTuning() {
        if (isStopping) return;
        if (!isTuning) {
            isTuning = true;
            actionBtn.innerText = "TUNING STOP";
            
            const timerBtn = document.getElementById('btn-timer-display');
            timerBtn.style.opacity = '0.5';
            timerBtn.style.pointerEvents = 'none'; // ボタンを操作不可にロック

            if (Tone.context.state !== 'running') await Tone.start();
    
            Tone.Destination.volume.cancelScheduledValues(Tone.now());
            Tone.Destination.volume.value = -3;

            initThree();
            createOsc(getFreq());
            updateAudioAndUI();
            env.triggerAttack();
            tuneStartTime = lastRenderRealTime = performance.now();
            timerSessionStartTime = performance.now();
            startLoop();
        } else {
            await stopTuning();
        }
    }

    function startLoop() { if (!rafId) rafId = requestAnimationFrame(loop); }
    function stopLoop() { if (rafId) { cancelAnimationFrame(rafId); rafId = null; } }
    
    function loop() {
        if (!isTuning) return;
        rafId = requestAnimationFrame(loop);
        
        const now = performance.now();

        // FPS間引き処理
        const elapsedSinceLastDraw = now - lastDrawTime;
        if (elapsedSinceLastDraw < FRAME_INTERVAL) return;
        lastDrawTime = now - (elapsedSinceLastDraw % FRAME_INTERVAL);
        
        if (!renderer || !material) return;
        
        // タイマー処理（バッテリー対策で1秒に1回だけ画面書き換え）
        if (timerDuration > 0 && !isStopping) {
            const elapsedSec = (now - timerSessionStartTime) / 1000;
            const totalSec = timerDuration * 60;
            const remaining = Math.max(0, totalSec - elapsedSec);
            
            const m = Math.floor(remaining / 60);
            const s = Math.floor(remaining % 60);
            const timerStr = m + ":" + (s < 10 ? "0" : "") + s;

            if (timerStr !== lastTimerStr) {
                document.getElementById('btn-timer-display').innerText = timerStr;
                lastTimerStr = timerStr;
            }

            if (remaining <= 0) {
                stopTuning();
                return;
            }
        }

        let alpha = isStopping ? Math.max(0, 1.0 - (now - stopStartTime) / 2000) : 1.0;
        const elapsed = (now - tuneStartTime) * 0.001;
        
        const halfBreath = breathMode === 0 ? 4.0 : 8.0; 
        const holdSec = 1.0;
        const period = halfBreath * 2 + holdSec * 2; 
        const t = elapsed % period;
        
        let pulse = 0;
        if (t <= holdSec) {
            pulse = 0.0;
        } else if (t > holdSec && t <= holdSec + halfBreath) {
            pulse = (1.0 - Math.cos(((t - holdSec) / halfBreath) * Math.PI)) * 0.5;
        } else if (t > holdSec + halfBreath && t <= holdSec * 2 + halfBreath) {
            pulse = 1.0;
        } else {
            pulse = (1.0 + Math.cos(((t - (holdSec * 2 + halfBreath)) / halfBreath) * Math.PI)) * 0.5;
        }

        shaderAccumulatedTime += Math.min((now - lastRenderRealTime)*0.001, 0.1);
        lastRenderRealTime = now;
        material.uniforms.uTime.value = shaderAccumulatedTime;
        material.uniforms.uPulse.value = pulse;
        material.uniforms.uOpacity.value = 0.6 * alpha;
        
        document.getElementById('bonji-bg').style.opacity = (0.3 + pulse * 0.5) * alpha;
        document.getElementById('chakra-ring').style.transform = "translate(-50%, -50%) scale(" + (0.5 + pulse * 0.5) + ")";
        renderer.render(scene, camera);
    }

    chakraData.forEach((c, i) => {
        const b = document.createElement('button'); 
        b.className = 'chakra-btn'; 
        b.innerText = c.id;
        b.onclick = () => { currentChakraIndex = i; updateAudioAndUI(); };
        document.getElementById('chakra-selector').appendChild(b);
    });

    actionBtn.onclick = toggleTuning;
    document.getElementById('btn-vis').onclick = () => { visMode = (visMode + 1) % 3; document.getElementById('btn-vis').innerText = ['VIS: 2D','VIS: 3D','VIS: 統合3D'][visMode]; if(material) material.uniforms.uVisMode.value = visMode; };
    document.getElementById('btn-tune').onclick = () => { tuningMode = (tuningMode + 1) % 3; document.getElementById('btn-tune').innerText = ['TUNE: 基本','TUNE: +1','TUNE: ソルフェ'][tuningMode]; updateAudioAndUI(); };
    document.getElementById('btn-breath').onclick = () => { breathMode = (breathMode + 1) % 2; document.getElementById('btn-breath').innerText = ['呼吸: 8秒','呼吸: 16秒'][breathMode]; };

    function checkForUpdate() {
        if ('serviceWorker' in navigator) {
            showToast("アップデートを確認中...");
            navigator.serviceWorker.getRegistration().then(reg => {
                if (reg) {
                    reg.update().then(() => {
                        if (reg.installing || reg.waiting) {
                            showToast("アップデートが見つかりました。再読込してください。");
                        } else {
                            showToast("最新バージョンです。");
                        }
                    });
                }
            });
        }
    }
    
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js').then(registration => {
                console.log('SW registered:', registration);
            }).catch(error => {
                console.log('SW registration failed:', error);
            });
        });
    }

    // 究極の省電力（バックグラウンド移行時の完全停止）
    document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
            if (Tone.context.state === 'running') Tone.context.suspend();
            stopLoop(); 
        } else {
            if (isTuning && Tone.context.state === 'suspended') {
                Tone.context.resume();
                startLoop(); 
            }
        }
    });

    window.addEventListener('pagehide', () => {
        destroyOsc();
        if (Tone.context.state === 'running') Tone.context.suspend();
    });

    updateAudioAndUI();
</script>


</body>
</html>
