<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="言霊チューナー">
    <title>言霊チューナー（省電力版）</title>
    
    <link rel="apple-touch-icon" sizes="180x180" href="https://mashiroqun.github.io/kotodama/icon2.png?v=2">
    <link rel="icon" href="icon2.png?v=2">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;400;700;900&family=Noto+Sans+JP:wght@400;700;900&family=Noto+Sans+Siddham&display=swap" rel="stylesheet">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <style>
        :root {
            --bg-color: #000000; 
            --text-color: #FFFFFF;
            --accent-color: #FF3333; 
        }

        html, body {
            margin: 0; padding: 0; width: 100%; height: 100dvh; 
            background-color: var(--bg-color); color: var(--text-color);
            font-family: 'Inter', sans-serif; font-weight: 100;
            overflow: hidden; touch-action: none; 
        }

        #webgl-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }

        #bonji-bg {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-family: 'Noto Sans Siddham', sans-serif; font-size: 45vh; 
            color: rgba(0, 0, 0, 0.8);
            -webkit-text-stroke: 1px rgba(255, 255, 255, 0.3); 
            text-shadow: 0 0 30px rgba(0,0,0,1), 0 0 40px var(--accent-color); /* 影のサイズは固定 */
            opacity: 0.4; z-index: 1; pointer-events: none;
            will-change: opacity; /* 最適化のヒント */
        }

        #ui-layer {
            position: relative; z-index: 3; 
            display: flex; flex-direction: column; justify-content: space-between; align-items: center;
            height: 100%; 
            padding-top: calc(env(safe-area-inset-top, 5vh) + 2vh);
            padding-bottom: calc(env(safe-area-inset-bottom, 5vh) + 3vh);
            padding-left: 5%; padding-right: 5%;
            box-sizing: border-box;
            background: linear-gradient(to bottom, rgba(0,0,0,0.6), transparent 30%, transparent 70%, rgba(0,0,0,0.8));
            pointer-events: none;
        }
        #ui-layer > * { pointer-events: auto; }

        header { flex: 0 0 auto; text-align: center; margin-top: 1vh; }
        .title-main { font-family: 'Noto Sans JP', sans-serif; font-size: clamp(20px, 6vw, 26px); font-weight: 900; letter-spacing: 5px; color: #FFF; }
        .title-sub { font-family: 'Inter', sans-serif; font-size: clamp(9px, 3vw, 12px); font-weight: 400; letter-spacing: 6px; color: var(--accent-color); margin-top: 0.5vh; transition: color 0.5s; }

        #central-node { flex: 1 1 auto; display: flex; flex-direction: column; justify-content: center; align-items: center; width: 100%; position: relative; min-height: 40vh; }

        #chakra-ring {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.5);
            width: clamp(240px, 75vw, 320px); height: clamp(240px, 75vw, 320px); 
            border: 4px solid rgba(255, 255, 255, 0.15); border-radius: 50%;
            box-shadow: 0 0 50px var(--accent-color); /* 影のサイズは固定 */
            z-index: -1; opacity: 0.4; pointer-events: none;
            will-change: transform, opacity; /* 最適化のヒント */
        }

        .ruby-text { font-family: 'Noto Sans JP', sans-serif; font-weight: 900; font-size: clamp(16px, 5vw, 22px); letter-spacing: 6px; opacity: 0.8; margin-bottom: -2vh; }
        .kanji { font-family: 'Noto Sans JP', sans-serif; font-weight: 900; font-size: clamp(100px, 30vw, 140px); color: var(--accent-color); margin-bottom: 1vh; transition: color 0.5s; }
        .on-guide { font-family: 'Inter', 'Noto Sans JP', sans-serif; font-size: clamp(18px, 6vw, 26px); letter-spacing: 4px; font-weight: 400; color: #EEE; }
        .note-display { font-size: clamp(14px, 4vw, 18px); font-weight: 700; margin-top: 1vh; font-family:'Inter', sans-serif; letter-spacing: 2px; color: #FFF; }

        #control-panel {
            flex: 0 0 auto; 
            background-color: rgba(15, 15, 15, 0.85); 
            border: 1px solid rgba(255,255,255,0.1); border-radius: 24px; 
            padding: 3% 5%; text-align: center; margin-bottom: 0; width: 100%; max-width: 400px;
        }

        #meaning { font-size: clamp(12px, 3.5vw, 15px); opacity: 0.9; margin-bottom: 2vh; letter-spacing: 1px; color: #CCC; font-family: 'Noto Sans JP', sans-serif;}
        
        #chakra-selector { display: flex; justify-content: space-between; width: 100%; gap: 2%; margin-bottom: 2vh; }
        .chakra-btn { flex: 1; aspect-ratio: 1 / 1; max-width: 45px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.5); cursor: pointer; display: flex; justify-content: center; align-items: center; color: rgba(255,255,255,0.7); font-family: 'Inter', sans-serif; font-weight: 700; font-size: clamp(12px, 3.5vw, 16px); padding: 0; transition: all 0.2s;}
        .chakra-btn.active { border-color: #FFF; box-shadow: 0 0 10px rgba(255,255,255,0.5); transform: scale(1.1); color: #FFF; }

        #action-btn { background: rgba(0,0,0,0.8); border: 2px solid var(--accent-color); color: var(--accent-color); padding: 2vh 5vw; border-radius: 35px; font-size: clamp(16px, 5vw, 20px); font-family: 'Inter', sans-serif; letter-spacing: 3px; font-weight: 700; cursor: pointer; transition: all 0.2s; width: 100%; margin-bottom: 2vh; touch-action: manipulation; }
        #action-btn:active { background-color: var(--accent-color); color: #000; transform: scale(0.97); }

        #debug-panel { display: flex; justify-content: space-between; gap: 2%; width: 100%; }
        .toggle-btn { flex: 1; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: #FFF; font-family: 'Inter', 'Noto Sans JP', sans-serif; font-size: clamp(8px, 2.2vw, 11px); padding: 1.5vh 0; border-radius: 8px; cursor: pointer; transition: all 0.2s; letter-spacing: 0.5px; touch-action: manipulation; }
        .toggle-btn:active { background: rgba(255,255,255,0.3); }
    </style>
</head>
<body>
    <div id="webgl-container"></div>
    <div id="bonji-bg">𑖀</div>

    <div id="ui-layer">
        <header>
            <div class="title-main">言霊チューナー</div>
            <div class="title-sub">CHAKRA TUNER</div>
        </header>

        <div id="central-node">
            <div id="chakra-ring"></div>
            <div id="yomi-display" class="ruby-text">ち</div>
            <div id="kanji-display" class="kanji">地</div>
            <div id="on-display" class="on-guide">ア / [ a ]</div>
            <div id="note-display" class="note-display">C3 (ド) / 131Hz</div>
        </div>
        
        <div id="control-panel">
            <div id="meaning">土 / 基盤 / 生命 / 会陰</div>
            <div id="chakra-selector"></div>
            <button id="action-btn">TUNING START</button>
            
            <div id="debug-panel">
                <button id="btn-vis" class="toggle-btn">VIS: 統合3D(粒)</button>
                <button id="btn-tune" class="toggle-btn">TUNE: 基本</button>
                <button id="btn-breath" class="toggle-btn">呼吸: 8秒</button>
            </div>
        </div>
    </div>

    <script id="vertexShader" type="x-shader/x-vertex">
        uniform float uTime;
        uniform float uChakraId;
        uniform float uBaseScale;
        uniform int uVisMode;
        attribute float aIndex; // パーティクルのインデックス

        const float PI = 3.14159265359;

        void main() {
            float particleCount = 1000.0;
            vec3 pos;

            if (uVisMode == 0) { // 2Dサイマ
                float a = uChakraId; float b = uChakraId + 1.0;
                float t = (aIndex / particleCount) * PI * 2.0;
                pos.x = sin(a * t + uTime * 0.5) * uBaseScale;
                pos.y = sin(b * t) * uBaseScale;
                pos.z = 0.0;
            } else if (uVisMode == 1) { // 3Dトーラス
                float numRings = 40.0; float pointsPerRing = particleCount / numRings;
                float R = uBaseScale * 0.8; float r = uBaseScale * 0.4;
                float ringIdx = floor(aIndex / pointsPerRing);
                float ptIdx = mod(aIndex, pointsPerRing);
                float u = (ringIdx / numRings) * PI * 2.0 + uTime * 0.2;
                float v = (ptIdx / pointsPerRing) * PI * 2.0 + uTime * 0.3;
                pos.x = (R + r * cos(v)) * cos(u);
                float y = (R + r * cos(v)) * sin(u);
                float z = r * sin(v);
                float rotX = PI / 4.0;
                pos.y = y * cos(rotX) - z * sin(rotX);
                pos.z = y * sin(rotX) + z * cos(rotX);
            } else { // 統合3D
                float a = uChakraId; float b = uChakraId + 2.0;
                float R = uBaseScale * 0.9; float r = uBaseScale * 0.5;
                float t = (aIndex / particleCount) * PI * 2.0;
                float u = a * t * 4.0 + uTime * 0.1;
                float v = b * t * 4.0 + uTime * 0.2; 
                float ripple = sin(uChakraId * 3.0 * t + uTime * 0.5) * (uBaseScale * 0.1);
                float x = (R + (r + ripple) * cos(v)) * cos(u);
                float y = (R + (r + ripple) * sin(v)) * sin(u);
                float z = (r + ripple) * sin(v);
                float rotX = uTime * 0.2;
                float y2 = y * cos(rotX) - z * sin(rotX);
                float z2 = y * sin(rotX) + z * cos(rotX);
                float rotY = uTime * 0.1;
                pos.x = x * cos(rotY) + z2 * sin(rotY);
                pos.y = y2;
                pos.z = -x * sin(rotY) + z2 * cos(rotY);
            }

            // 回転（JavaScriptからGPUへ移行）
            float rotZ = uTime * 0.05;
            float finalX = pos.x * cos(rotZ) - pos.y * sin(rotZ);
            float finalY = pos.x * sin(rotZ) + pos.y * cos(rotZ);
            
            vec4 mvPosition = modelViewMatrix * vec4(finalX, finalY, pos.z, 1.0);
            gl_Position = projectionMatrix * mvPosition;

            // ★ 遠近感に応じて粒のサイズを変える（GPU）
            gl_PointSize = (12.0 * (uBaseScale / 150.0)) / (-mvPosition.z / 300.0);
        }
    </script>

    <script id="fragmentShader" type="x-shader/x-fragment">
        uniform vec3 uColor;
        uniform float uOpacity;

        void main() {
            // ★ gl_PointCoord で粒を丸く、中心を明るくグラデーションさせる ★
            float dist = distance(gl_PointCoord, vec2(0.5, 0.5));
            if (dist > 0.5) discard; 
            float strength = 1.0 - (dist * 2.0); 
            strength = pow(strength, 2.0); // 柔らかい光に

            gl_FragColor = vec4(uColor, strength * uOpacity);
        }
    </script>

    <script>
        document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

        const chakraData = [
            { id: 1, kanji: "地", yomi: "ち", on: "ア", phonetic: "a", note: "C3", solfege: "ド", color: 0xFF3333, strColor: "#FF3333", bonji: "𑖀", meaning: "土 / 基盤 / 生命 / 会陰" },
            { id: 2, kanji: "海", yomi: "うみ", on: "ウ", phonetic: "u", note: "D3", solfege: "レ", color: 0xFF8C00, strColor: "#FF8C00", bonji: "𑖪", meaning: "水 / 創造 / 感情 / 丹田" },
            { id: 3, kanji: "陽", yomi: "よう", on: "オ", phonetic: "o", note: "E3", solfege: "ミ", color: 0xFFD700, strColor: "#FFD700", bonji: "𑖨", meaning: "火 / 意志 / 活力 / みぞおち" },
            { id: 4, kanji: "和", yomi: "わ", on: "オ", phonetic: "o", note: "F3", solfege: "ファ", color: 0x00CC66, strColor: "#00CC66", bonji: "𑖮", meaning: "風 / 調和 / 愛 / 胸" },
            { id: 5, kanji: "響", yomi: "ひびき", on: "エ", phonetic: "e", note: "G3", solfege: "ソ", color: 0x00BFFF, strColor: "#00BFFF", bonji: "𑖏", meaning: "空 / 表現 / 空間 / 喉" },
            { id: 6, kanji: "理", yomi: "ことわり", on: "イ", phonetic: "i", note: "A3", solfege: "ラ", color: 0x4169E1, strColor: "#4169E1", bonji: "𑖌", meaning: "識 / 直感 / 叡智 / 眉間" },
            { id: 7, kanji: "宙", yomi: "そら・くう", on: "ン", phonetic: "m", note: "B3", solfege: "シ", color: 0xEE82EE, strColor: "#EE82EE", bonji: "𑖮𑖳𑖽", meaning: "(吽) / 統合 / 超越 / 頭頂" }
        ];
        const solfeggioFreqs = [396, 417, 528, 639, 741, 852, 963];

        let currentChakraIndex = 0; 
        let isTuning = false; let isStopping = false; let stopStartTime = 0; let oscStarted = false; 
        let visMode = 2; const visNames = ['VIS: 2Dサイマ', 'VIS: 3Dトーラス', 'VIS: 統合3D'];
        let tuningMode = 0; const tuneNames = ['TUNE: 基本', 'TUNE: ＋１', 'TUNE: ソルフェジオ'];
        
        let breathMode = 0; const breathNames = ['呼吸: 8秒', '呼吸: 16秒'];

        // --- Tone.js Setup ---
        const reverb = new Tone.Freeverb({ roomSize: 0.9, dampening: 3000 }).toDestination();
        const chorus = new Tone.Chorus({ frequency: 0.2, delayTime: 3.5, depth: 0.8 }).connect(reverb).start();
        const filter = new Tone.Filter({ frequency: 600, type: "lowpass", rolloff: -24 }).connect(chorus);
        const env = new Tone.AmplitudeEnvelope({ attack: 1.5, decay: 0.0, sustain: 1.0, release: 3.0 }).connect(filter);
        const osc = new Tone.Oscillator({ type: "triangle", volume: 5 }).connect(env);

        // --- Three.js Setup ---
        const container = document.getElementById('webgl-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 400;

        // ★ 最適化1: powerPreference: "low-power" で省電力GPUを優先 ★
        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: false, powerPreference: "low-power" }); 
        renderer.setSize(window.innerWidth, window.innerHeight);

        // ★ 最適化2: スマホ（幅768px未満）ではPixelRatioを0.6に落として負荷軽減 ★
        const pixelRatio = window.devicePixelRatio > 1 ? (window.innerWidth < 768 ? 0.6 : 1.0) : 1.0;
        renderer.setPixelRatio(pixelRatio); 
        container.appendChild(renderer.domElement);

        // 静的なジオメトリ（座標計算はGPUへ移行するため、ここではインデックスのみ設定）
        const particleCount = 1000; 
        const geometry = new THREE.BufferGeometry();
        const indices = new Float32Array(particleCount);
        for (let i = 0; i < particleCount; i++) {
            indices[i] = i;
        }
        geometry.setAttribute('aIndex', new THREE.BufferAttribute(indices, 1)); // シェーダーに渡すインデックス

        // ★ 最適化3: 独自のShaderMaterialを作成。XYZ計算、サイズ、グラデ、アルファをすべてGPUで行う ★
        const chakraUniforms = {
            uTime: { value: 0 },
            uChakraId: { value: chakraData[currentChakraIndex].id },
            uBaseScale: { value: 150 },
            uColor: { value: new THREE.Color(chakraData[currentChakraIndex].color) },
            uOpacity: { value: 0.0 },
            uVisMode: { value: visMode } 
        };

        const material = new THREE.ShaderMaterial({
            uniforms: chakraUniforms,
            vertexShader: document.getElementById('vertexShader').textContent,
            fragmentShader: document.getElementById('fragmentShader').textContent,
            transparent: true,
            blending: THREE.AdditiveBlending, 
            depthWrite: false,
        });

        const particleSystem = new THREE.Points(geometry, material);
        scene.add(particleSystem);

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- UI Setup ---
        const bonjiBg = document.getElementById('bonji-bg');
        const chakraRing = document.getElementById('chakra-ring'); 
        const kanjiDisplay = document.getElementById('kanji-display');
        const yomiDisplay = document.getElementById('yomi-display');
        const onDisplay = document.getElementById('on-display');
        const noteDisplay = document.getElementById('note-display');
        const meaningDisplay = document.getElementById('meaning');
        const actionBtn = document.getElementById('action-btn');
        const chakraSelector = document.getElementById('chakra-selector');
        
        const btnVis = document.getElementById('btn-vis');
        const btnTune = document.getElementById('btn-tune');
        const btnBreath = document.getElementById('btn-breath'); 

        chakraData.forEach((chakra, index) => {
            const btn = document.createElement('button');
            btn.className = 'chakra-btn';
            btn.style.backgroundColor = chakra.strColor;
            btn.innerText = chakra.id; 
            btn.onclick = () => selectChakra(index);
            chakraSelector.appendChild(btn);
        });

        function updateAudioAndUI() {
            const data = chakraData[currentChakraIndex];
            kanjiDisplay.innerText = data.kanji;
            yomiDisplay.innerText = data.yomi;
            bonjiBg.innerText = data.bonji; 
            onDisplay.innerText = `${data.on} / [ ${data.phonetic} ]`;
            meaningDisplay.innerText = data.meaning;
            
            let targetFreqVal;
            if (tuningMode === 2) {
                targetFreqVal = solfeggioFreqs[currentChakraIndex];
                noteDisplay.innerText = `ソルフェジオ / ${targetFreqVal}Hz`; 
            } else {
                const baseFreq = Tone.Frequency(data.note);
                const targetFreq = baseFreq.transpose(tuningMode * 12);
                targetFreqVal = targetFreq.toFrequency();
                let noteNameDisplay = tuningMode === 1 ? baseFreq.transpose(12).toNote().toUpperCase() : data.note;
                noteDisplay.innerText = `${noteNameDisplay} (${data.solfege}) / ${Math.round(targetFreqVal)}Hz`;
            }
            
            document.documentElement.style.setProperty('--accent-color', data.strColor);

            // ★ シェーダーのユニフォーム変数を更新 ★
            chakraUniforms.uChakraId.value = data.id;
            chakraUniforms.uColor.value.setHex(data.color);

            document.querySelectorAll('.chakra-btn').forEach((btn, i) => {
                btn.className = `chakra-btn ${i === currentChakraIndex ? 'active' : ''}`;
                btn.style.backgroundColor = i === currentChakraIndex ? data.strColor : 'rgba(255,255,255,0.1)';
            });

            // チャクラ切り替え時に影の色を更新
            bonjiBg.style.textShadow = `0 0 30px rgba(0,0,0,1), 0 0 40px ${data.strColor}`;
            chakraRing.style.boxShadow = `0 0 50px ${data.strColor}`;

            if (isTuning && !isStopping) osc.frequency.rampTo(targetFreqVal, 1.5);
        }

        function selectChakra(index) { currentChakraIndex = index; updateAudioAndUI(); }

        btnVis.onclick = () => { visMode = (visMode + 1) % 3; btnVis.innerText = visNames[visMode]; chakraUniforms.uVisMode.value = visMode; };
        btnTune.onclick = () => { tuningMode = (tuningMode + 1) % 3; btnTune.innerText = tuneNames[tuningMode]; updateAudioAndUI(); };
        btnBreath.onclick = () => { breathMode = (breathMode + 1) % 2; btnBreath.innerText = breathNames[breathMode]; };

        selectChakra(currentChakraIndex);

        actionBtn.onclick = async () => {
            if (isStopping) return; 

            if (!isTuning) {
                isTuning = true;
                actionBtn.innerText = "TUNING STOP";
                
                if (Tone.context.state !== 'running') await Tone.start();
                if (!oscStarted) { osc.start(); oscStarted = true; }

                osc.frequency.value = tuningMode === 2 ? solfeggioFreqs[currentChakraIndex] : Tone.Frequency(chakraData[currentChakraIndex].note).transpose(tuningMode * 12).toFrequency();
                env.triggerAttack();
                
            } else {
                isStopping = true; 
                stopStartTime = performance.now();
                env.triggerRelease();
                actionBtn.innerText = "TUNING START";

                setTimeout(() => {
                    if (isStopping) {
                        isTuning = false; isStopping = false;
                        // material.opacity ではなくユニフォームを更新
                        chakraUniforms.uOpacity.value = 0.0; 
                        Tone.context.suspend(); 

                        // 停止時の固定状態
                        bonjiBg.style.opacity = "0.4";
                        chakraRing.style.transform = `translate(-50%, -50%) scale(0.5)`;
                        chakraRing.style.opacity = "0.4";
                    }
                }, 3000); 
            }
        };

        // --- 描画ループ（GPUへ丸投げしたため、JavaScript側の計算は激減） ---
        let lastDrawTime = 0;
        const fpsInterval = 1000 / 30; // 30FPS制限は維持
        let breathPhase = -Math.PI / 2; 

        function animate(currentTime) {
            requestAnimationFrame(animate);

            // ★ 最適化4: 待機中は完全にスキップ ★
            if (!isTuning && !isStopping) return;

            if (!currentTime) currentTime = performance.now();
            const elapsedSinceLastDraw = currentTime - lastDrawTime;
            
            if (elapsedSinceLastDraw < fpsInterval) return;
            lastDrawTime = currentTime - (elapsedSinceLastDraw % fpsInterval);

            const now = performance.now() * 0.001;
            const dt = elapsedSinceLastDraw / 1000; 
            
            let fadeAlpha = 1.0;
            if (isStopping) {
                const elapsed = (performance.now() - stopStartTime) / 3000;
                fadeAlpha = Math.max(0, 1.0 - elapsed);
            }

            const targetPeriod = breathMode === 0 ? 8 : 16;
            const angularFreq = (Math.PI * 2) / targetPeriod;
            breathPhase += angularFreq * dt; 

            const pulse = ((Math.sin(breathPhase) + 1) / 2) * fadeAlpha; 
            
            // ★ シェーダーのユニフォーム（時間、ベーススケール、アルファ）を更新 ★
            chakraUniforms.uTime.value = now;
            chakraUniforms.uBaseScale.value = 150 + pulse * 20; // 呼吸によるスケール変化
            chakraUniforms.uOpacity.value = (0.3 + pulse * 0.5) * fadeAlpha; // 呼吸とフェードによる不透明度変化

            // DOM（CSS）の更新は、 opacity と scale だけに限定し、GPUで処理されるように
            bonjiBg.style.opacity = (0.4 + (pulse * 0.4)) * fadeAlpha;

            const ringScale = 0.5 + (pulse * 0.5); 
            chakraRing.style.transform = `translate(-50%, -50%) scale(${ringScale})`;
            chakraRing.style.opacity = (0.4 + (pulse * 0.4)) * fadeAlpha;

            // XYZ座標の計算はJavaScript側からは完全に削除しました（GPU側がやっています）

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
