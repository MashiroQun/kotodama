<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="言霊チューナー">
    <title>言霊チューナー（完全版）</title>

<link rel="apple-touch-icon" sizes="180x180" href="https://mashiroqun.github.io/kotodama/icon2.png?v=2">
<link rel="icon" href="icon2.png?v=2">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;400;700;900&family=Noto+Sans+JP:wght@400;700;900&family=Noto+Sans+Siddham&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<link rel="manifest" href="manifest.json">

<style>
    :root { --bg-color: #000000; --text-color: #FFFFFF; --accent-color: #FF3333; }
    html, body { margin: 0; padding: 0; width: 100%; height: 100dvh; background-color: var(--bg-color); color: var(--text-color); font-family: 'Inter', sans-serif; font-weight: 100; overflow: hidden; touch-action: none; }
    #webgl-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
    #bonji-bg { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-family: 'Noto Sans Siddham', sans-serif; font-size: 45vh; color: rgba(0, 0, 0, 0.8); -webkit-text-stroke: 1px rgba(255, 255, 255, 0.3); text-shadow: 0 0 30px rgba(0,0,0,1), 0 0 20px var(--accent-color); opacity: 0.4; z-index: 1; pointer-events: none; will-change: opacity; }
    #chakra-ring { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.5); width: clamp(240px, 75vw, 320px); height: clamp(240px, 75vw, 320px); border: 4px solid rgba(255, 255, 255, 0.15); border-radius: 50%; box-shadow: 0 0 30px var(--accent-color); z-index: -1; opacity: 0.4; pointer-events: none; will-change: transform, opacity; }
    #ui-layer { position: relative; z-index: 3; display: flex; flex-direction: column; justify-content: space-between; align-items: center; height: 100%; padding-top: calc(env(safe-area-inset-top, 5vh) + 2vh); padding-bottom: calc(env(safe-area-inset-bottom, 5vh) + 3vh); padding-left: 5%; padding-right: 5%; box-sizing: border-box; background: linear-gradient(to bottom, rgba(0,0,0,0.6), transparent 30%, transparent 70%, rgba(0,0,0,0.8)); pointer-events: none; }
    #ui-layer > * { pointer-events: auto; }
    header { flex: 0 0 auto; text-align: center; margin-top: 1vh; }
    .title-main { font-family: 'Noto Sans JP', sans-serif; font-size: clamp(20px, 6vw, 26px); font-weight: 900; letter-spacing: 5px; color: #FFF; }
    .title-sub { font-family: 'Inter', sans-serif; font-size: clamp(9px, 3vw, 12px); font-weight: 400; letter-spacing: 6px; color: var(--accent-color); margin-top: 0.5vh; transition: color 0.5s; }
    #central-node { flex: 1 1 auto; display: flex; flex-direction: column; justify-content: center; align-items: center; width: 100%; position: relative; min-height: 45vh; }
    .ruby-text { font-family: 'Noto Sans JP', sans-serif; font-weight: 900; font-size: clamp(16px, 5vw, 22px); letter-spacing: 6px; opacity: 0.8; height: 1.5em; display: flex; align-items: flex-end; justify-content: center; margin-bottom: -1vh; }
    .kanji { font-family: 'Noto Sans JP', sans-serif; font-weight: 900; font-size: clamp(100px, 30vw, 140px); color: var(--accent-color); transition: color 0.5s; height: 1.2em; display: flex; align-items: center; justify-content: center; margin-bottom: 1vh; line-height: 1; }
    .on-guide { font-family: 'Inter', 'Noto Sans JP', sans-serif; font-size: clamp(18px, 6vw, 26px); letter-spacing: 4px; font-weight: 400; color: #EEE; height: 1.5em; display: flex; align-items: center; justify-content: center; }
    .note-display { font-size: clamp(14px, 4vw, 18px); font-weight: 700; font-family:'Inter', sans-serif; letter-spacing: 2px; color: #FFF; height: 1.5em; display: flex; align-items: center; justify-content: center; margin-top: 0.5vh; }
    #control-panel { flex: 0 0 auto; background-color: rgba(15, 15, 15, 0.85); border: 1px solid rgba(255,255,255,0.1); border-radius: 24px; padding: 3% 5%; text-align: center; margin-bottom: 0; width: 100%; max-width: 400px; }
    #meaning { font-size: clamp(12px, 3.5vw, 15px); opacity: 0.9; margin-bottom: 2vh; letter-spacing: 1px; color: #CCC; font-family: 'Noto Sans JP', sans-serif;}
    #chakra-selector { display: flex; justify-content: space-between; width: 100%; gap: 2%; margin-bottom: 2vh; }
    .chakra-btn { flex: 1; aspect-ratio: 1 / 1; max-width: 45px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.5); cursor: pointer; display: flex; justify-content: center; align-items: center; color: rgba(255,255,255,0.7); font-family: 'Inter', sans-serif; font-weight: 700; font-size: clamp(12px, 3.5vw, 16px); padding: 0; transition: all 0.2s;}
    .chakra-btn.active { border-color: #FFF; box-shadow: 0 0 10px rgba(255,255,255,0.5); transform: scale(1.1); color: #FFF; }
    #action-btn { background: rgba(0,0,0,0.8); border: 2px solid var(--accent-color); color: var(--accent-color); padding: 2vh 5vw; border-radius: 35px; font-size: clamp(16px, 5vw, 20px); font-family: 'Inter', sans-serif; letter-spacing: 3px; font-weight: 700; cursor: pointer; transition: all 0.2s; width: 100%; margin-bottom: 2vh; touch-action: manipulation; }
    #action-btn:active { background-color: var(--accent-color); color: #000; transform: scale(0.97); }
    #debug-panel { display: flex; justify-content: space-between; gap: 2%; width: 100%; }
    .toggle-btn { flex: 1; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: #FFF; font-family: 'Inter', 'Noto Sans JP', sans-serif; font-size: clamp(8px, 2.2vw, 11px); padding: 1.5vh 0; border-radius: 8px; cursor: pointer; transition: all 0.2s; letter-spacing: 0.5px; touch-action: manipulation; }
    .toggle-btn:active { background: rgba(255,255,255,0.3); }
</style>
</head>
<body>
    <div id="webgl-container"></div>
    <div id="bonji-bg">𑖀</div>
    <div id="ui-layer">
        <header>
            <div class="title-main">言霊チューナー</div>
            <div class="title-sub">CHAKRA TUNER</div>
        </header>
        <div id="central-node">
            <div id="chakra-ring"></div>
            <div id="yomi-display" class="ruby-text">ち</div>
            <div id="kanji-display" class="kanji">地</div>
            <div id="on-display" class="on-guide">ア / [ a ]</div>
            <div id="note-display" class="note-display">C3 (ド) / 131Hz</div>
        </div>
        <div id="control-panel">
            <div id="meaning">土 / 基盤 / 生命 / 会陰</div>
            <div id="chakra-selector"></div>
            <button id="action-btn">TUNING START</button>
            <div id="debug-panel">
                <button id="btn-vis" class="toggle-btn">VIS: 統合3D</button>
                <button id="btn-tune" class="toggle-btn">TUNE: 基本</button>
                <button id="btn-breath" class="toggle-btn">呼吸: 8秒</button>
            </div>
        </div>
    </div>

<script>
    const chakraData = [
        { id: 1, kanji: "地", yomi: "ち", on: "ア", phonetic: "a", note: "C3", solfege: "ド", color: 0xFF3333, strColor: "#FF3333", bonji: "𑖀", meaning: "土 / 基盤 / 生命 / 会陰" },
        { id: 2, kanji: "海", yomi: "うみ", on: "ウ", phonetic: "u", note: "D3", solfege: "レ", color: 0xFF8C00, strColor: "#FF8C00", bonji: "𑖪", meaning: "水 / 創造 / 感情 / 丹田" },
        { id: 3, kanji: "陽", yomi: "よう", on: "オ", phonetic: "o", note: "E3", solfege: "ミ", color: 0xFFD700, strColor: "#FFD700", bonji: "𑖨", meaning: "火 / 意志 /活力 / みぞおち" },
        { id: 4, kanji: "和", yomi: "わ", on: "オ", phonetic: "o", note: "F3", solfege: "ファ", color: 0x00CC66, strColor: "#00CC66", bonji: "𑖮", meaning: "風 / 調和 / 愛 / 胸" },
        { id: 5, kanji: "響", yomi: "ひびき", on: "エ", phonetic: "e", note: "G3", solfege: "ソ", color: 0x00BFFF, strColor: "#00BFFF", bonji: "𑖏", meaning: "空 / 表現 / 空間 / 喉" },
        { id: 6, kanji: "理", yomi: "ことわり", on: "イ", phonetic: "i", note: "A3", solfege: "ラ", color: 0x4169E1, strColor: "#4169E1", bonji: "𑖌", meaning: "識 / 直感 / 叡智 / 眉間" },
        { id: 7, kanji: "宙", yomi: "そら", on: "ン", phonetic: "m", note: "B3", solfege: "シ", color: 0xEE82EE, strColor: "#EE82EE", bonji: "𑖮𑖳𑖽", meaning: "(吽) / 統合 / 超越 / 頭頂" }
    ];
    const solfeggioFreqs = [396, 417, 528, 639, 741, 852, 963];
    const visNames = ['VIS: 2Dサイマ', 'VIS: 3Dトーラス', 'VIS: 統合3D'];
    const tuneNames = ['TUNE: 基本', 'TUNE: ＋１', 'TUNE: ソルフェジオ'];
    const breathNames = ['呼吸: 8秒', '呼吸: 16秒'];

    let currentChakraIndex = 0;
    let isTuning = false;
    let isStopping = false;
    let stopStartTime = 0;
    let visMode = 2;
    let tuningMode = 0;
    let breathMode = 0;
    
    let rafId = null;
    let lastTs = 0;
    let prevPulseForDOM = -1;

    let tuneStartTime = 0;
    let shaderAccumulatedTime = 0;
    let lastRenderRealTime = 0;

    const TARGET_FPS = 24;
    const TARGET_INTERVAL = 1000 / TARGET_FPS;

    const isIPhone = /iPhone/.test(navigator.userAgent);
    const isIPad = /iPad|Macintosh/.test(navigator.userAgent) && 'ontouchend' in document;

    // ▼ さらなる省電力化のため、解像度を0.3に低下（見た目の柔らかさは維持）
    const CONFIG = isIPhone
        ? { particles: 200, pixelRatio: 0.35 }
        : isIPad
        ? { particles: 320, pixelRatio: 0.4 }
        : { particles: 500, pixelRatio: 0.5 };

    const bonjiBg       = document.getElementById('bonji-bg');
    const chakraRing    = document.getElementById('chakra-ring');
    const kanjiDisplay  = document.getElementById('kanji-display');
    const yomiDisplay   = document.getElementById('yomi-display');
    const onDisplay     = document.getElementById('on-display');
    const noteDisplay   = document.getElementById('note-display');
    const meaningDisplay= document.getElementById('meaning');
    const actionBtn     = document.getElementById('action-btn');
    const chakraSelector= document.getElementById('chakra-selector');
    const btnVis        = document.getElementById('btn-vis');
    const btnTune       = document.getElementById('btn-tune');
    const btnBreath     = document.getElementById('btn-breath');

    let renderer, scene, camera, particleSystem, material;

    // ノイズ対策：念のためさらに先読みバッファを増やして安定させる
    Tone.context.lookAhead = 0.2; 

    const reverb = new Tone.Freeverb({ roomSize: 0.6, dampening: 4000 }).toDestination();
    const delay  = new Tone.PingPongDelay({ delayTime: 0.3, feedback: 0.2, wet: 0.15 }).connect(reverb);
    const filter = new Tone.Filter({ frequency: 600, type: "lowpass", rolloff: -24 }).connect(delay);
    const env    = new Tone.AmplitudeEnvelope({ attack: 1.5, decay: 0, sustain: 1, release: 2.0 }).connect(filter);
    const osc    = new Tone.Oscillator({ type: "triangle", volume: -6 }).connect(env);
    osc.start();

    function initThree() {
        if (renderer) return;
        const container = document.getElementById('webgl-container');
        scene    = new THREE.Scene();
        camera   = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
        camera.position.z = 400;

        renderer = new THREE.WebGLRenderer({ alpha: true, antialias: false, powerPreference: "low-power" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(CONFIG.pixelRatio);
        container.appendChild(renderer.domElement);

        const count = CONFIG.particles;
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(count * 3);
        const indices   = new Float32Array(count);
        for (let i = 0; i < count; i++) indices[i] = i / count;
        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('aIndex',   new THREE.BufferAttribute(indices,    1));

        material = new THREE.ShaderMaterial({
            uniforms: {
                uTime:     { value: 0.0 },
                uPulse:    { value: 0.0 },
                uColor:    { value: new THREE.Color(chakraData[currentChakraIndex].color) },
                uChakraId: { value: float(chakraData[currentChakraIndex].id) },
                uVisMode:  { value: float(visMode) },
                uOpacity:  { value: 0.0 }
            },
            vertexShader: `
                uniform float uTime;
                uniform float uPulse;
                uniform float uChakraId;
                uniform float uVisMode;
                attribute float aIndex;
                const float PI2 = 6.2831853;

                void main() {
                    float isOuter = step(0.5, aIndex);
                    float dir = isOuter == 1.0 ? -1.0 : 1.0;
                    float scaleMul = isOuter == 1.0 ? 1.25 : 0.75;

                    float t = fract(aIndex * 2.0) * PI2;
                    float S = (150.0 + uPulse * 40.0) * scaleMul;
                    vec3 pos;

                    if (uVisMode < 0.5) {
                        float a = uChakraId * t + uTime * 0.5 * dir;
                        pos = vec3(sin(a) * S, cos(t * (uChakraId + 1.0)) * S, 0.0);
                    } else if (uVisMode < 1.5) {
                        float u = floor(fract(aIndex * 2.0) * 20.0) * (PI2 / 20.0) + uTime * 0.2 * dir;
                        float v = fract(aIndex * 40.0) * PI2 + uTime * 0.3;
                        float cu = cos(u); float su = sin(u);
                        float cv = cos(v); float sv = sin(v);
                        float R = S * 0.8, r = S * 0.4;
                        float rc = R + r * cv;
                        pos = vec3(rc * cu, rc * su, r * sv);
                    } else {
                        float u = uChakraId * t * 4.0 + uTime * 0.1 * dir;
                        float v = (uChakraId + 2.0) * t * 4.0 + uTime * 0.2;
                        float cu = cos(u); float su = sin(u);
                        float cv = cos(v); float sv = sin(v);
                        float r = S * 0.5;
                        float rc = S * 0.9 + r * cv;
                        pos = vec3(rc * cu, rc * su * sv, r * sv);
                    }

                    gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
                    gl_PointSize = (2.5 + uPulse * 2.5) * (isOuter == 1.0 ? 0.7 : 1.3);
                }
            `,
            fragmentShader: `
                precision mediump float;
                uniform vec3 uColor;
                uniform float uOpacity;
                void main() {
                    vec2 d = gl_PointCoord - 0.5;
                    if (dot(d, d) > 0.25) discard;
                    gl_FragColor = vec4(uColor, uOpacity);
                }
            `,
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });

        particleSystem = new THREE.Points(geometry, material);
        particleSystem.frustumCulled = false;
        scene.add(particleSystem);
    }

    function float(v) { return parseFloat(v); }

    function disposeThree() {
        if (!renderer) return;
        particleSystem.geometry.dispose();
        particleSystem.material.dispose();
        renderer.dispose();
        document.getElementById('webgl-container').innerHTML = "";
        renderer = null;
        material = null;
        particleSystem = null;
    }

    function updateAudioAndUI() {
        const data = chakraData[currentChakraIndex];
        kanjiDisplay.innerText = data.kanji;
        yomiDisplay.innerText  = data.yomi;
        bonjiBg.innerText      = data.bonji;
        onDisplay.innerText    = `${data.on} / [ ${data.phonetic} ]`;
        meaningDisplay.innerText = data.meaning;

        let targetFreqVal;
        if (tuningMode === 2) {
            targetFreqVal = solfeggioFreqs[currentChakraIndex];
            noteDisplay.innerText = `ソルフェジオ / ${targetFreqVal}Hz`;
        } else {
            const baseFreq   = Tone.Frequency(data.note);
            const targetFreq = baseFreq.transpose(tuningMode * 12);
            targetFreqVal    = targetFreq.toFrequency();
            noteDisplay.innerText = `${tuningMode === 1 ? baseFreq.transpose(12).toNote().toUpperCase() : data.note} (${data.solfege}) / ${Math.round(targetFreqVal)}Hz`;
        }

        document.documentElement.style.setProperty('--accent-color', data.strColor);
        if (material) {
            material.uniforms.uColor.value.setHex(data.color);
            material.uniforms.uChakraId.value = float(data.id);
        }

        document.querySelectorAll('.chakra-btn').forEach((btn, i) => {
            btn.className = `chakra-btn ${i === currentChakraIndex ? 'active' : ''}`;
            btn.style.backgroundColor = i === currentChakraIndex ? data.strColor : 'rgba(255,255,255,0.1)';
        });

        bonjiBg.style.textShadow  = `0 0 30px rgba(0,0,0,1), 0 0 40px ${data.strColor}`;
        chakraRing.style.boxShadow = `0 0 50px ${data.strColor}`;

        if (isTuning && !isStopping) osc.frequency.rampTo(targetFreqVal, 1.5);
    }

    async function toggleTuning() {
        if (isStopping) return;

        if (!isTuning) {
            isTuning = true;
            actionBtn.innerText = "TUNING STOP";
            if (Tone.context.state !== 'running') await Tone.start();
            reverb.wet.value = 0.4;
            delay.wet.value  = 0.15;
            initThree();
            osc.volume.value = -6;
            updateAudioAndUI();
            env.triggerAttack();
            
            prevPulseForDOM = -1;
            
            const now = performance.now();
            tuneStartTime = now;
            lastRenderRealTime = now;
            shaderAccumulatedTime = 0;
            lastTs = now;
            
            startLoop();

        } else {
            isStopping = true;
            actionBtn.disabled = true;
            actionBtn.innerText = "RESETTING...";
            stopStartTime = performance.now();
            env.triggerRelease();
            setTimeout(() => { osc.volume.rampTo(-Infinity, 1.0); }, 1000);

            setTimeout(async () => {
                try {
                    stopLoop();
                    await Tone.context.suspend();
                    disposeThree();
                } catch(e) { console.log(e); }
                finally {
                    isTuning   = false;
                    isStopping = false;
                    actionBtn.disabled = false;
                    actionBtn.innerText = "TUNING START";
                    bonjiBg.style.opacity    = 0.4;
                    chakraRing.style.opacity = 0.4;
                    chakraRing.style.transform = "translate(-50%, -50%) scale(0.5)";
                }
            }, 3500);
        }
    }

    function startLoop() {
        if (rafId) return;
        lastTs = performance.now();
        rafId = requestAnimationFrame(loop);
    }

    function loop(ts) {
        if (!isTuning) return;
        rafId = requestAnimationFrame(loop);
        
        const dt = ts - lastTs;
        if (dt < TARGET_INTERVAL) return;

        lastTs = ts - (dt % TARGET_INTERVAL); 
        drawFrame(ts);
    }

    function drawFrame(ts) {
        if (!renderer || !material) return;

        const currentNow = performance.now();
        let fadeAlpha = 1.0;
        
        if (isStopping) {
            fadeAlpha = Math.max(0, 1.0 - (currentNow - stopStartTime) / 2500);
            if (fadeAlpha <= 0) return;
        }

        const elapsedSec = (currentNow - tuneStartTime) * 0.001;
        
        // ▼ 人間の感覚に基づいた呼吸ロジック（インターバルは数えない）
        const activeSec = breathMode === 0 ? 4.0 : 8.0; // 吸う・吐くの実働時間
        const holdSec = 1.0; // 切り替えのタメ時間
        const period = activeSec * 2 + holdSec * 2; // トータル周期 (10秒 or 18秒)
        const t = elapsedSec % period;
        let pulse = 0;

        if (t < holdSec) {
            // 吐き切った後のインターバル
            pulse = 0.0;
        } else if (t < holdSec + activeSec) {
            // 吸う（コサイン補間で滑らかに立ち上がる）
            const phaseT = t - holdSec;
            pulse = (1.0 - Math.cos((phaseT / activeSec) * Math.PI)) * 0.5;
        } else if (t < holdSec * 2 + activeSec) {
            // 吸い切った後のインターバル
            pulse = 1.0;
        } else {
            // 吐く（コサイン補間で滑らかに落ち着く）
            const phaseT = t - (holdSec * 2 + activeSec);
            pulse = (1.0 + Math.cos((phaseT / activeSec) * Math.PI)) * 0.5;
        }

        const deltaSec = Math.min((currentNow - lastRenderRealTime) * 0.001, 0.1);
        lastRenderRealTime = currentNow;
        shaderAccumulatedTime += deltaSec;

        if (Math.abs(prevPulseForDOM - pulse) > 0.01 || fadeAlpha < 1.0) {
            prevPulseForDOM = pulse;
            bonjiBg.style.opacity = (0.3 + pulse * 0.5) * fadeAlpha;
            chakraRing.style.opacity = (0.2 + pulse * 0.4) * fadeAlpha;
            chakraRing.style.transform = "translate(-50%, -50%) scale(" + (0.5 + pulse * 0.5) + ")";
        }

        material.uniforms.uTime.value    = shaderAccumulatedTime;
        material.uniforms.uPulse.value   = pulse;
        material.uniforms.uOpacity.value = (0.3 + pulse * 0.6) * fadeAlpha;

        particleSystem.rotation.z += deltaSec * 0.05;

        renderer.render(scene, camera);
    }

    chakraData.forEach((chakra, index) => {
        const btn = document.createElement('button');
        btn.className = 'chakra-btn';
        btn.style.backgroundColor = 'rgba(255,255,255,0.1)';
        btn.innerText = chakra.id;
        btn.onclick = () => { currentChakraIndex = index; updateAudioAndUI(); };
        chakraSelector.appendChild(btn);
    });

    actionBtn.onclick = toggleTuning;

    btnVis.onclick = () => {
        visMode = (visMode + 1) % 3;
        btnVis.innerText = visNames[visMode];
        if (material) material.uniforms.uVisMode.value = float(visMode);
    };

    btnTune.onclick = () => {
        tuningMode = (tuningMode + 1) % 3;
        btnTune.innerText = tuneNames[tuningMode];
        updateAudioAndUI();
    };

    btnBreath.onclick = () => {
        breathMode = (breathMode + 1) % 2;
        btnBreath.innerText = breathNames[breathMode];
    };

    window.addEventListener('resize', () => {
        if (camera && renderer) {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
    });

    document.addEventListener("visibilitychange", () => {
        if (document.hidden) {
            if (isTuning) {
                stopLoop();
                Tone.context.suspend();
            }
        } else {
            if (isTuning && !isStopping) {
                Tone.context.resume();
                lastTs = performance.now();
                lastRenderRealTime = performance.now(); 
                startLoop();
            }
        }
    });

    document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

    updateAudioAndUI();
</script>

</body>
