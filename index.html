<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="言霊チューナー">
    <title>言霊チューナー</title>
    
    <link rel="apple-touch-icon" sizes="180x180" href="https://mashiroqun.github.io/kotodama/icon.png?v=1">
    <link rel="icon" href="icon.png?v=1">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;400;700;900&family=Noto+Sans+JP:wght@400;700;900&family=Noto+Sans+Siddham&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.min.js"></script>
    <style>
        :root {
            /* ★ OELDディスプレイ最適化：完全な黒(純黒)を採用 */
            --bg-color: #000000; 
            --text-color: #FFFFFF;
            --accent-color: #FF3333; 
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-blur: blur(15px);
        }

        html, body {
            margin: 0; padding: 0; width: 100%; 
            height: 100dvh; 
            background-color: var(--bg-color); color: var(--text-color);
            font-family: 'Inter', sans-serif; font-weight: 100;
            overflow: hidden; 
            touch-action: none; 
        }

        #visualizer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }

        #bonji-bg {
            position: absolute; 
            top: 50%; 
            left: 50%; transform: translate(-50%, -50%);
            font-family: 'Noto Sans Siddham', sans-serif; 
            font-size: 50vh; 
            color: rgba(0, 0, 0, 1);
            -webkit-text-stroke: 3px rgba(10, 10, 10, 0.5);
            text-shadow: 0 0 30px rgba(0,0,0,1), 0 0 20px var(--accent-color);
            opacity: 0.3; z-index: 1; pointer-events: none;
            transition: color 0.5s, opacity 0.5s;
        }

        #ui-layer {
            position: relative; z-index: 3; 
            display: flex; flex-direction: column; justify-content: space-between; align-items: center;
            height: 100%; 
            padding-top: calc(env(safe-area-inset-top, 5vh) + 2vh);
            padding-bottom: calc(env(safe-area-inset-bottom, 5vh) + 3vh);
            padding-left: 5%;
            padding-right: 5%;
            box-sizing: border-box;
            background: linear-gradient(to bottom, rgba(0,0,0,0.3), transparent 40%, rgba(0,0,0,0.8));
            pointer-events: none;
        }
        #ui-layer > * { pointer-events: auto; }

        header { flex: 0 0 auto; text-align: center; margin-top: 1vh; }
        .title-main { font-family: 'Noto Sans JP', sans-serif; font-size: clamp(20px, 6vw, 26px); font-weight: 900; letter-spacing: 5px; color: #FFF; text-shadow: 0 2px 5px rgba(0,0,0,0.8); }
        .title-sub { font-family: 'Inter', sans-serif; font-size: clamp(9px, 3vw, 12px); font-weight: 400; letter-spacing: 6px; color: var(--accent-color); margin-top: 0.5vh; transition: color 0.5s; }

        #central-node { 
            flex: 1 1 auto; display: flex; flex-direction: column; justify-content: center; align-items: center; 
            width: 100%; position: relative; 
            min-height: 40vh; 
        }

        #chakra-ring {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: clamp(240px, 75vw, 320px); 
            height: clamp(240px, 75vw, 320px); 
            border: 6px solid rgba(255, 255, 255, 0.2); 
            border-radius: 50%;
            box-shadow: 
                0 0 50px var(--accent-color), 
                inset 0 0 25px var(--accent-color), 
                inset 0 0 0 2px rgba(0, 0, 0, 1); 
            z-index: -1; 
            opacity: 0.3;
            pointer-events: none;
            transition: box-shadow 0.5s, border-color 0.5s, opacity 0.5s;
        }

        .ruby-text { font-family: 'Noto Sans JP', sans-serif; font-weight: 900; font-size: clamp(16px, 5vw, 22px); letter-spacing: 6px; opacity: 0.8; margin-bottom: -2vh; text-shadow: 0 2px 5px rgba(0,0,0,0.9); }
        
        .kanji {
            font-family: 'Noto Sans JP', sans-serif; font-weight: 900; 
            font-size: clamp(100px, 30vw, 140px); 
            color: var(--accent-color);
            text-shadow: 0px 5px 15px rgba(0,0,0,1), 0px 0px 10px rgba(0,0,0,0.8), 0px 0px 30px rgba(0,0,0,0.6);
            margin-bottom: 1vh; transition: color 0.5s;
        }
        
        .on-guide { font-family: 'Inter', 'Noto Sans JP', sans-serif; font-size: clamp(18px, 6vw, 26px); letter-spacing: 4px; font-weight: 400; color: #EEE; text-shadow: 0 2px 5px rgba(0,0,0,0.9); }
        
        .note-display { font-size: clamp(14px, 4vw, 18px); font-weight: 700; opacity: 1; margin-top: 1vh; font-family:'Inter', sans-serif; letter-spacing: 2px; color: #FFF; text-shadow: 0 2px 10px rgba(0,0,0,1), 0 0 5px rgba(0,0,0,0.8);}

        #control-panel {
            flex: 0 0 auto; background-color: var(--glass-bg); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 24px; 
            padding: 3% 5%; 
            text-align: center; 
            margin-bottom: 0; 
            width: 100%; max-width: 400px;
        }

        #meaning { font-size: clamp(12px, 3.5vw, 15px); opacity: 0.9; margin-bottom: 2vh; letter-spacing: 1px; color: #CCC; font-family: 'Noto Sans JP', sans-serif;}
        
        #chakra-selector { display: flex; justify-content: space-between; width: 100%; gap: 2%; margin-bottom: 2vh; }
        .chakra-btn {
            flex: 1; aspect-ratio: 1 / 1; max-width: 45px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.2);
            background: rgba(0,0,0,0.3); cursor: pointer; transition: all 0.3s;
            display: flex; justify-content: center; align-items: center;
            color: rgba(255,255,255,0.7); font-family: 'Inter', sans-serif; font-weight: 700; 
            font-size: clamp(12px, 3.5vw, 16px); padding: 0;
        }
        .chakra-btn.active { border-color: #FFF; box-shadow: 0 0 15px rgba(255,255,255,0.9); transform: scale(1.1); color: #FFF; text-shadow: 0 0 5px #000; }

        #action-btn {
            background: rgba(0,0,0,0.6); border: 2px solid var(--accent-color); color: var(--accent-color);
            padding: 2.5vh 5vw; border-radius: 35px; 
            font-size: clamp(16px, 5vw, 20px); font-family: 'Inter', sans-serif;
            letter-spacing: 3px; font-weight: 700; cursor: pointer; transition: all 0.3s;
            text-shadow: 0 0 10px var(--accent-color); width: 100%; margin-bottom: 2vh;
        }
        #action-btn:active { background-color: var(--accent-color); color: #000; text-shadow: none; }

        #debug-panel { display: flex; justify-content: space-between; gap: 2%; width: 100%; }
        .toggle-btn {
            flex: 1; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
            color: #FFF; font-family: 'Inter', 'Noto Sans JP', sans-serif; 
            font-size: clamp(9px, 2.5vw, 12px);
            padding: 1.5vh 0; border-radius: 8px; cursor: pointer; transition: all 0.2s; letter-spacing: 1px;
        }
        .toggle-btn:active { background: rgba(255,255,255,0.3); }
    </style>
</head>
<body>
    <canvas id="visualizer"></canvas>
    <div id="bonji-bg">𑖀</div>

    <div id="ui-layer">
        <header>
            <div class="title-main">言霊チューナー</div>
            <div class="title-sub">CHAKRA TUNER</div>
        </header>

        <div id="central-node">
            <div id="chakra-ring"></div>
            
            <div id="yomi-display" class="ruby-text">ち</div>
            <div id="kanji-display" class="kanji">地</div>
            <div id="on-display" class="on-guide">ア / [ a ]</div>
            <div id="note-display" class="note-display">C3 (ド) / 131Hz</div>
        </div>
        
        <div id="control-panel">
            <div id="meaning">土 / 基盤 / 生命 / 会陰</div>
            <div id="chakra-selector"></div>
            <button id="action-btn">TUNING START</button>
            
            <div id="debug-panel">
                <button id="btn-vis" class="toggle-btn">VIS: 統合3D(粒)</button>
                <button id="btn-tune" class="toggle-btn">TUNE: 基本</button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('touchmove', function(event) {
            event.preventDefault();
        }, { passive: false });

        const chakraData = [
            { id: 1, kanji: "地", yomi: "ち", on: "ア", phonetic: "a", note: "C3", solfege: "ド", color: "#FF3333", bonji: "𑖀", meaning: "土 / 基盤 / 生命 / 会陰" },
            { id: 2, kanji: "海", yomi: "うみ", on: "ウ", phonetic: "u", note: "D3", solfege: "レ", color: "#FF8C00", bonji: "𑖪", meaning: "水 / 創造 / 感情 / 丹田" },
            { id: 3, kanji: "陽", yomi: "よう", on: "オ", phonetic: "o", note: "E3", solfege: "ミ", color: "#FFD700", bonji: "𑖨", meaning: "火 / 意志 / 活力 / みぞおち" },
            { id: 4, kanji: "和", yomi: "わ", on: "オ", phonetic: "o", note: "F3", solfege: "ファ", color: "#00CC66", bonji: "𑖮", meaning: "風 / 調和 / 愛 / 胸" },
            { id: 5, kanji: "響", yomi: "ひびき", on: "エ", phonetic: "e", note: "G3", solfege: "ソ", color: "#00BFFF", bonji: "𑖏", meaning: "空 / 表現 / 空間 / 喉" },
            { id: 6, kanji: "理", yomi: "ことわり", on: "イ", phonetic: "i", note: "A3", solfege: "ラ", color: "#4169E1", bonji: "𑖌", meaning: "識 / 直感 / 叡智 / 眉間" },
            { id: 7, kanji: "宙", yomi: "そら・くう", on: "ン", phonetic: "m", note: "B3", solfege: "シ", color: "#EE82EE", bonji: "𑖮𑖳𑖽", meaning: "(吽) / 統合 / 超越 / 頭頂" }
        ];

        const solfeggioFreqs = [396, 417, 528, 639, 741, 852, 963];

        let currentChakraIndex = 0; 
        let isTuning = false;
        let isStopping = false; 
        let stopStartTime = 0;
        let oscStarted = false; 

        let visMode = 2; 
        const visNames = ['VIS: 2Dサイマ(線)', 'VIS: 3Dトーラス(粒)', 'VIS: 統合3D(粒)'];

        let tuningMode = 0; 
        const tuneNames = ['TUNE: 基本', 'TUNE: ＋１', 'TUNE: ソルフェジオ'];

        const reverb = new Tone.Freeverb({ roomSize: 0.9, dampening: 3000 }).toDestination();
        const chorus = new Tone.Chorus({ frequency: 0.2, delayTime: 3.5, depth: 0.8 }).connect(reverb).start();
        const filter = new Tone.Filter({ frequency: 600, type: "lowpass", rolloff: -24 }).connect(chorus);
        
        const env = new Tone.AmplitudeEnvelope({ attack: 1.5, decay: 0.0, sustain: 1.0, release: 3.0 }).connect(filter);
        const osc = new Tone.Oscillator({ type: "triangle", volume: 5 }).connect(env);

        const bonjiBg = document.getElementById('bonji-bg');
        const chakraRing = document.getElementById('chakra-ring'); 
        const kanjiDisplay = document.getElementById('kanji-display');
        const yomiDisplay = document.getElementById('yomi-display');
        const onDisplay = document.getElementById('on-display');
        const noteDisplay = document.getElementById('note-display');
        const meaningDisplay = document.getElementById('meaning');
        const actionBtn = document.getElementById('action-btn');
        const chakraSelector = document.getElementById('chakra-selector');
        
        const btnVis = document.getElementById('btn-vis');
        const btnTune = document.getElementById('btn-tune');

        const canvas = document.getElementById('visualizer');
        const ctx = canvas.getContext('2d', { alpha: false }); 
        
        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize); resize();

        chakraData.forEach((chakra, index) => {
            const btn = document.createElement('button');
            btn.className = 'chakra-btn';
            btn.style.backgroundColor = chakra.color;
            btn.innerText = chakra.id; 
            btn.onclick = () => selectChakra(index);
            chakraSelector.appendChild(btn);
        });

        function updateAudioAndUI() {
            const data = chakraData[currentChakraIndex];
            kanjiDisplay.innerText = data.kanji;
            yomiDisplay.innerText = data.yomi;
            bonjiBg.innerText = data.bonji; 
            onDisplay.innerText = `${data.on} / [ ${data.phonetic} ]`;
            meaningDisplay.innerText = data.meaning;
            
            let targetFreqVal;

            if (tuningMode === 2) {
                targetFreqVal = solfeggioFreqs[currentChakraIndex];
                noteDisplay.innerText = `ソルフェジオ / ${targetFreqVal}Hz`; 
            } else {
                const baseFreq = Tone.Frequency(data.note);
                const targetFreq = baseFreq.transpose(tuningMode * 12);
                targetFreqVal = targetFreq.toFrequency();
                
                let noteNameDisplay = data.note;
                if (tuningMode === 1) {
                    noteNameDisplay = baseFreq.transpose(12).toNote().toUpperCase(); 
                }
                noteDisplay.innerText = `${noteNameDisplay} (${data.solfege}) / ${Math.round(targetFreqVal)}Hz`;
            }
            
            document.documentElement.style.setProperty('--accent-color', data.color);
            document.querySelectorAll('.chakra-btn').forEach((btn, i) => {
                btn.className = `chakra-btn ${i === currentChakraIndex ? 'active' : ''}`;
                btn.style.backgroundColor = i === currentChakraIndex ? data.color : 'rgba(255,255,255,0.1)';
            });

            if (isTuning && !isStopping) {
                osc.frequency.rampTo(targetFreqVal, 1.5);
            }
        }

        function selectChakra(index) {
            currentChakraIndex = index;
            updateAudioAndUI();
        }

        btnVis.onclick = () => { visMode = (visMode + 1) % 3; btnVis.innerText = visNames[visMode]; };
        btnTune.onclick = () => { tuningMode = (tuningMode + 1) % 3; btnTune.innerText = tuneNames[tuningMode]; updateAudioAndUI(); };

        selectChakra(currentChakraIndex);

        actionBtn.onclick = async () => {
            if (!isTuning) {
                await Tone.start();
                if (!oscStarted) { osc.start(); oscStarted = true; }

                let freqVal;
                if (tuningMode === 2) {
                    freqVal = solfeggioFreqs[currentChakraIndex];
                } else {
                    freqVal = Tone.Frequency(chakraData[currentChakraIndex].note).transpose(tuningMode * 12).toFrequency();
                }
                osc.frequency.value = freqVal;
                
                env.triggerAttack();
                
                actionBtn.innerText = "TUNING STOP";
                bonjiBg.style.opacity = "0.6"; 
                chakraRing.style.opacity = "0.8"; 
                
                isTuning = true;
                isStopping = false;
                
                // ★ 描画ループ開始
                lastDrawTime = performance.now();
                draw();
            } else if (!isStopping) {
                isStopping = true;
                stopStartTime = performance.now();
                env.triggerRelease();
                
                actionBtn.innerText = "TUNING START";
                bonjiBg.style.transform = `translate(-50%, -50%) scale(1)`;
                chakraRing.style.transform = `translate(-50%, -50%) scale(1)`;

                setTimeout(() => {
                    if (isStopping) {
                        isTuning = false;
                        isStopping = false;
                        bonjiBg.style.opacity = "0.3";
                        chakraRing.style.opacity = "0.3";
                        
                        ctx.globalCompositeOperation = "source-over";
                        ctx.fillStyle = "#000000"; // ★ 純黒でリセット
                        ctx.fillRect(0, 0, canvas.width, canvas.height);
                    }
                }, 3000); 
            }
        };

        function colorToRGBA(hex, alpha) {
            let r = parseInt(hex.slice(1, 3), 16);
            let g = parseInt(hex.slice(3, 5), 16);
            let b = parseInt(hex.slice(5, 7), 16);
            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }

        // ★ FPS制限用の変数
        let lastDrawTime = 0;
        const fpsInterval = 1000 / 30; // 30fpsに制限（1フレーム約33.3ms）

        function draw(currentTime) {
            if (!isTuning) return;
            requestAnimationFrame(draw);

            // ★ FPS制御：前回の描画から十分な時間が経過していなければスキップ
            const elapsedSinceLastDraw = currentTime - lastDrawTime;
            if (elapsedSinceLastDraw < fpsInterval) {
                return;
            }
            lastDrawTime = currentTime - (elapsedSinceLastDraw % fpsInterval);

            // アニメーション用の時間は、常に経過時間（パフォーマンスカウンター）を使う
            const now = performance.now();
            const time = now * 0.001;
            
            let fadeAlpha = 1.0;
            if (isStopping) {
                const elapsed = (now - stopStartTime) / 3000;
                fadeAlpha = Math.max(0, 1.0 - elapsed);
            }

            // ★ 呼吸スピードの最適化：周期を遅くして「深呼吸」に
            // time * Math.PI / 4 とすることで、約8秒で1サイクル（吸う・吐く）になります
            const pulse = ((Math.sin(time * Math.PI / 4) + 1) / 2) * fadeAlpha; 
            const color = chakraData[currentChakraIndex].color;

            const scaleAmount = 1 + (pulse * 0.15); 
            const shadowSpread = 20 + (pulse * 40); 
            bonjiBg.style.transform = `translate(-50%, -50%) scale(${scaleAmount})`;
            bonjiBg.style.textShadow = `0 0 30px rgba(0,0,0,1), 0 0 ${shadowSpread}px ${color}`;
            bonjiBg.style.opacity = 0.3 + (pulse * 0.3);
            
            chakraRing.style.transform = `translate(-50%, -50%) scale(${1 + pulse * 0.05})`;
            chakraRing.style.opacity = (0.3 + (pulse * 0.5)) * fadeAlpha;

            ctx.globalCompositeOperation = "source-over";
            // ★ 残像エフェクトの背景色を純黒ベースに変更し、OLEDに最適化
            ctx.fillStyle = `rgba(0, 0, 0, ${isStopping ? 0.15 : 0.35})`; 
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.globalCompositeOperation = "lighter";

            const cx = canvas.width / 2;
            const cy = canvas.height / 2;
            const chId = chakraData[currentChakraIndex].id; 

            if (visMode === 0) {
                const a = chId; const b = chId + 1;
                const scale = (Math.min(canvas.width, canvas.height) * 0.35) + pulse * 40;
                const steps = 200; 

                ctx.beginPath();
                ctx.strokeStyle = colorToRGBA(color, fadeAlpha * 0.8);
                ctx.lineWidth = 2 + pulse * 3;
                
                for (let i = 0; i <= steps; i++) {
                    const t = (i / steps) * Math.PI * 2;
                    // ★ 2Dサイマティクスの動きも少しゆったりさせる
                    const px = cx + Math.sin(a * t + time * 0.5) * scale;
                    const py = cy + Math.sin(b * t) * scale;
                    if (i === 0) ctx.moveTo(px, py);
                    else ctx.lineTo(px, py);
                }
                ctx.stroke();

            } else if (visMode === 1) {
                const numRings = 15; 
                const pointsPerRing = 20; 
                const torusRadius = (Math.min(canvas.width, canvas.height) * 0.3) + (pulse * 20);
                const rBase = (Math.min(canvas.width, canvas.height) * 0.15) + (pulse * 30); 

                for (let i = 0; i < numRings; i++) {
                    const angle = (i / numRings) * Math.PI * 2 + time * 0.15;
                    const ringCx = Math.cos(angle) * torusRadius;
                    const ringCy = Math.sin(angle) * torusRadius;
                    
                    for (let j = 0; j < pointsPerRing; j++) {
                        const phi = (j / pointsPerRing) * Math.PI * 2 + time * 0.25;
                        let x3d = ringCx + Math.cos(phi) * rBase * Math.cos(angle);
                        let y3d = ringCy + Math.cos(phi) * rBase * Math.sin(angle);
                        let z3d = Math.sin(phi) * rBase;

                        const rotX = Math.PI / 3;
                        let y2 = y3d * Math.cos(rotX) - z3d * Math.sin(rotX);
                        let z2 = y3d * Math.sin(rotX) + z3d * Math.cos(rotX);
                        y3d = y2; z3d = z2;

                        const focal = 300;
                        const scale = focal / (focal + z3d);
                        const px = cx + x3d * scale;
                        const py = cy + y3d * scale;

                        const pAlpha = 0.5 - (chId - 1) * 0.05; 
                        ctx.fillStyle = colorToRGBA(color, Math.max(0.1, pAlpha) * fadeAlpha); 
                        
                        const size = (1 + pulse) * scale * 3;
                        ctx.fillRect(px - size/2, py - size/2, size, size);
                    }
                }

            } else if (visMode === 2) {
                const baseScale = Math.min(canvas.width, canvas.height) * 0.35;
                const R = baseScale + (pulse * baseScale * 0.4); 
                const r = baseScale * 0.4 + (pulse * 30);

                const a = chId; const b = chId + 2;
                const steps = 400; 

                for (let i = 0; i <= steps; i++) {
                    const t = (i / steps) * Math.PI * 2;
                    const u = a * t * 4 + time * 0.2;
                    const v = b * t * 4 + time * 0.3; 

                    const ripple = Math.sin(chId * 3 * t + time * 0.5) * (baseScale * 0.15);

                    let x3d = (R + (r + ripple) * Math.cos(v)) * Math.cos(u);
                    let y3d = (R + (r + ripple) * Math.sin(v)) * Math.sin(u);
                    let z3d = (r + ripple) * Math.sin(v);

                    const rotX = time * 0.1;
                    let y2 = y3d * Math.cos(rotX) - z3d * Math.sin(rotX);
                    let z2 = y3d * Math.sin(rotX) + z3d * Math.cos(rotX);
                    y3d = y2; z3d = z2;

                    const rotY = time * 0.15;
                    let x2 = x3d * Math.cos(rotY) + z3d * Math.sin(rotY);
                    let z3 = -x3d * Math.sin(rotY) + z3d * Math.cos(rotY);
                    x3d = x2; z3d = z3;

                    const focal = 600;
                    const zPersp = focal + z3d;
                    const scale = focal / (zPersp > 0.1 ? zPersp : 0.1);

                    const px = cx + x3d * scale;
                    const py = cy + y3d * scale;

                    const pAlpha = 0.35 - (chId - 1) * 0.03; 
                    ctx.fillStyle = colorToRGBA(color, Math.max(0.08, pAlpha) * fadeAlpha); 

                    const size = (1 + pulse * 1.0) * scale * 3.5;
                    ctx.fillRect(px - size/2, py - size/2, size, size);
                }
            }
        }
    </script>
</body>
</html>
