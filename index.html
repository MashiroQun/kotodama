<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="言霊チューナー">
    <title>言霊チューナー</title>

<link rel="apple-touch-icon" sizes="180x180" href="https://mashiroqun.github.io/kotodama/icon2.png?v=2">
<link rel="icon" href="icon2.png?v=2">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;400;700;900&family=Noto+Sans+JP:wght@400;700;900&family=Noto+Sans+Siddham&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<link rel="manifest" href="manifest.json">

<style>
    :root { 
        --bg-color: #000000; --text-color: #FFFFFF; --accent-color: #FF3333; 
        /* アニメーション用変数 */
        --bonji-op: 0.4; --ring-op: 0.4; --ring-scale: 0.5;
    }
    html, body { margin: 0; padding: 0; width: 100%; height: 100dvh; background-color: var(--bg-color); color: var(--text-color); font-family: 'Inter', sans-serif; font-weight: 100; overflow: hidden; touch-action: none; }
    #webgl-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
    
    #bonji-bg { 
        position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
        font-family: 'Noto Sans Siddham', sans-serif; font-size: 45vh; color: rgba(0, 0, 0, 0.8); 
        -webkit-text-stroke: 1px rgba(255, 255, 255, 0.3); 
        text-shadow: 0 0 30px rgba(0,0,0,1), 0 0 20px var(--accent-color); 
        opacity: var(--bonji-op); z-index: 1; pointer-events: none; 
    }
    
    #chakra-ring { 
        position: absolute; top: 50%; left: 50%; 
        transform: translate(-50%, -50%) scale(var(--ring-scale)); 
        width: clamp(240px, 75vw, 320px); height: clamp(240px, 75vw, 320px); 
        border: 4px solid rgba(255, 255, 255, 0.15); border-radius: 50%; 
        box-shadow: 0 0 30px var(--accent-color); z-index: -1; 
        opacity: var(--ring-op); pointer-events: none; 
    }

    #ui-layer { position: relative; z-index: 3; display: flex; flex-direction: column; justify-content: space-between; align-items: center; height: 100%; padding: calc(env(safe-area-inset-top, 5vh) + 2vh) 5% calc(env(safe-area-inset-bottom, 5vh) + 3vh); box-sizing: border-box; background: linear-gradient(to bottom, rgba(0,0,0,0.6), transparent 30%, transparent 70%, rgba(0,0,0,0.8)); pointer-events: none; }
    #ui-layer > * { pointer-events: auto; }
    
    .title-main { font-family: 'Noto Sans JP', sans-serif; font-size: clamp(20px, 6vw, 26px); font-weight: 900; letter-spacing: 5px; color: #FFF; text-align: center; }
    .title-sub { font-family: 'Inter', sans-serif; font-size: clamp(9px, 3vw, 12px); font-weight: 400; letter-spacing: 6px; color: var(--accent-color); margin-top: 0.5vh; transition: color 0.5s; text-align: center; }
    
    #central-node { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; width: 100%; position: relative; }
    .ruby-text { font-family: 'Noto Sans JP', sans-serif; font-weight: 900; font-size: clamp(16px, 5vw, 22px); letter-spacing: 6px; opacity: 0.8; margin-bottom: -2vh; }
    .kanji { font-family: 'Noto Sans JP', sans-serif; font-weight: 900; font-size: clamp(100px, 30vw, 140px); color: var(--accent-color); margin-bottom: 1vh; transition: color 0.5s; }
    .on-guide { font-family: 'Inter', 'Noto Sans JP', sans-serif; font-size: clamp(18px, 6vw, 26px); letter-spacing: 4px; font-weight: 400; color: #EEE; }
    .note-display { font-size: clamp(14px, 4vw, 18px); font-weight: 700; margin-top: 1vh; font-family:'Inter', sans-serif; letter-spacing: 2px; color: #FFF; }
    
    #control-panel { background-color: rgba(15, 15, 15, 0.85); border: 1px solid rgba(255,255,255,0.1); border-radius: 24px; padding: 20px; text-align: center; width: 100%; max-width: 400px; }
    #meaning { font-size: clamp(12px, 3.5vw, 15px); opacity: 0.9; margin-bottom: 2vh; letter-spacing: 1px; color: #CCC; }
    #chakra-selector { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 2vh; }
    
    .chakra-btn { 
        flex: 1; aspect-ratio: 1; border-radius: 50%; border: 2px solid rgba(255,255,255,0.2); 
        background: rgba(0,0,0,0.5); cursor: pointer; color: #FFF; font-weight: 700; 
        transition: all 0.2s; padding: 0;
    }
    .chakra-btn.active { border-color: #FFF; box-shadow: 0 0 15px var(--accent-color); transform: scale(1.1); }
    
    #action-btn { 
        background: rgba(0,0,0,0.8); border: 2px solid var(--accent-color); color: var(--accent-color); 
        padding: 15px; border-radius: 35px; font-size: 18px; font-weight: 700; letter-spacing: 3px; 
        cursor: pointer; transition: all 0.2s; width: 100%; margin-bottom: 15px;
    }
    #action-btn:active { background: var(--accent-color); color: #000; }

    #debug-panel { display: flex; justify-content: space-between; gap: 8px; }
    .toggle-btn { flex: 1; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: #FFF; font-size: 10px; padding: 10px 0; border-radius: 8px; }
</style>
</head>
<body>
    <div id="webgl-container"></div>
    <div id="bonji-bg">𑖀</div>
    <div id="ui-layer">
        <header>
            <div class="title-main">言霊チューナー</div>
            <div class="title-sub">CHAKRA TUNER</div>
        </header>
        <div id="central-node">
            <div id="chakra-ring"></div>
            <div id="yomi-display" class="ruby-text">ち</div>
            <div id="kanji-display" class="kanji">地</div>
            <div id="on-display" class="on-guide">ア / [ a ]</div>
            <div id="note-display" class="note-display">C3 (ド) / 131Hz</div>
        </div>
        <div id="control-panel">
            <div id="meaning">土 / 基盤 / 生命 / 会陰</div>
            <div id="chakra-selector"></div>
            <button id="action-btn">TUNING START</button>
            <div id="debug-panel">
                <button id="btn-vis" class="toggle-btn">VIS: 統合3D</button>
                <button id="btn-tune" class="toggle-btn">TUNE: 基本</button>
                <button id="btn-breath" class="toggle-btn">呼吸: 8秒</button>
            </div>
        </div>
    </div>

<script>
    const chakraData = [
        { id: 1, kanji: "地", yomi: "ち", on: "ア", phonetic: "a", note: "C3", solfege: "ド", color: 0xFF3333, strColor: "#FF3333", bonji: "𑖀", meaning: "土 / 基盤 / 生命 / 会陰" },
        { id: 2, kanji: "海", yomi: "うみ", on: "ウ", phonetic: "u", note: "D3", solfege: "レ", color: 0xFF8C00, strColor: "#FF8C00", bonji: "𑖪", meaning: "水 / 創造 / 感情 / 丹田" },
        { id: 3, kanji: "陽", yomi: "よう", on: "オ", phonetic: "o", note: "E3", solfege: "ミ", color: 0xFFD700, strColor: "#FFD700", bonji: "𑖨", meaning: "火 / 意志 /活力 / みぞおち" },
        { id: 4, kanji: "和", yomi: "わ", on: "オ", phonetic: "o", note: "F3", solfege: "ファ", color: 0x00CC66, strColor: "#00CC66", bonji: "𑖮", meaning: "風 / 調和 / 愛 / 胸" },
        { id: 5, kanji: "響", yomi: "ひびき", on: "エ", phonetic: "e", note: "G3", solfege: "ソ", color: 0x00BFFF, strColor: "#00BFFF", bonji: "𑖏", meaning: "空 / 表現 / 空間 / 喉" },
        { id: 6, kanji: "理", yomi: "ことわり", on: "イ", phonetic: "i", note: "A3", solfege: "ラ", color: 0x4169E1, strColor: "#4169E1", bonji: "𑖌", meaning: "識 / 直感 / 叡智 / 眉間" },
        { id: 7, kanji: "宙", yomi: "そら", on: "ン", phonetic: "m", note: "B3", solfege: "シ", color: 0xEE82EE, strColor: "#EE82EE", bonji: "𑖮𑖳𑖽", meaning: "(吽) / 統合 / 超越 / 頭頂" }
    ];
    const solfeggioFreqs = [396, 417, 528, 639, 741, 852, 963];
    const visNames = ['VIS: 2Dサイマ', 'VIS: 3Dトーラス', 'VIS: 統合3D'];
    const tuneNames = ['TUNE: 基本', 'TUNE: ＋１', 'TUNE: ソルフェジオ'];
    const breathNames = ['呼吸: 8秒', '呼吸: 16秒'];

    let currentChakraIndex = 0, isTuning = false, isStopping = false;
    let visMode = 2, tuningMode = 0, breathMode = 0;
    let rafId = null, renderer, scene, camera, particleSystem, material;
    let breathPhase = -Math.PI / 2, lastFrameTime = 0, stopStartTime = 0;
    let wakeLock = null;

    const isMobile = /iPhone|iPad/i.test(navigator.userAgent);
    const CONFIG = isMobile ? { fps: 30, particles: 200, dpr: 1.0 } : { fps: 60, particles: 600, dpr: window.devicePixelRatio };
    const TARGET_INTERVAL = 1000 / CONFIG.fps;

    const bonjiBg = document.getElementById('bonji-bg'), chakraRing = document.getElementById('chakra-ring');
    const actionBtn = document.getElementById('action-btn');

    const reverb = new Tone.Freeverb({ roomSize: 0.6, dampening: 4000 }).toDestination();
    const delay  = new Tone.PingPongDelay({ delayTime: 0.3, feedback: 0.2, wet: 0.15 }).connect(reverb);
    const filter = new Tone.Filter({ frequency: 600, type: "lowpass" }).connect(delay);
    const env    = new Tone.AmplitudeEnvelope({ attack: 1.5, release: 2.0 }).connect(filter);
    const osc    = new Tone.Oscillator({ type: "triangle", volume: -6 }).connect(env);
    osc.start();

    // スリープ防止
    async function requestWakeLock() {
        if ('wakeLock' in navigator) {
            try { wakeLock = await navigator.wakeLock.request('screen'); } catch (err) {}
        }
    }
    function releaseWakeLock() {
        if (wakeLock) { wakeLock.release(); wakeLock = null; }
    }

    function initThree() {
        if (renderer) return;
        const container = document.getElementById('webgl-container');
        renderer = new THREE.WebGLRenderer({ alpha: true, antialias: false, powerPreference: "low-power" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(CONFIG.dpr);
        container.appendChild(renderer.domElement);

        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 400;

        const geo = new THREE.BufferGeometry();
        const pos = new Float32Array(CONFIG.particles * 3), idx = new Float32Array(CONFIG.particles);
        for(let i=0; i<CONFIG.particles; i++) idx[i] = i / CONFIG.particles;
        geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
        geo.setAttribute('aIndex', new THREE.BufferAttribute(idx, 1));

        material = new THREE.ShaderMaterial({
            uniforms: { uTime:{value:0}, uPulse:{value:0}, uColor:{value:new THREE.Color(chakraData[0].color)}, uChakraId:{value:1}, uVisMode:{value:2}, uOpacity:{value:0} },
            vertexShader: `
                uniform float uTime, uPulse, uChakraId, uVisMode; attribute float aIndex;
                void main() {
                    float t = aIndex * 6.28318; float S = 150.0 + uPulse * 40.0; vec3 pos;
                    if (uVisMode < 0.5) {
                        pos = vec3(sin(uChakraId * t + uTime * 0.5) * S, cos(t * (uChakraId + 1.0)) * S, 0.0);
                    } else if (uVisMode < 1.5) {
                        float u = floor(aIndex * 20.0) * 0.314 + uTime * 0.2, v = fract(aIndex * 20.0) * 6.28 + uTime * 0.3;
                        float rc = S * 0.8 + S * 0.4 * cos(v);
                        pos = vec3(rc * cos(u), rc * sin(u), S * 0.4 * sin(v));
                    } else {
                        float u = uChakraId * t * 4.0 + uTime * 0.1, v = (uChakraId + 2.0) * t * 4.0 + uTime * 0.2;
                        float rc = S * 0.9 + S * 0.5 * cos(v);
                        pos = vec3(rc * cos(u), rc * sin(u) * sin(v), S * 0.5 * sin(v));
                    }
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
                    gl_PointSize = 2.5 + uPulse * 2.5;
                }
            `,
            fragmentShader: `
                precision mediump float; uniform vec3 uColor; uniform float uOpacity;
                void main() { if (distance(gl_PointCoord, vec2(0.5)) > 0.5) discard; gl_FragColor = vec4(uColor, uOpacity); }
            `,
            transparent: true, blending: THREE.AdditiveBlending, depthWrite: false
        });
        particleSystem = new THREE.Points(geo, material);
        scene.add(particleSystem);
    }

    function drawFrame(ts) {
        if (!renderer) return;
        const now = ts * 0.001;
        const dt = (ts - lastFrameTime) * 0.001;
        const fade = isStopping ? Math.max(0, 1.0 - (ts - stopStartTime) / 2500) : 1.0;
        const period = breathMode === 0 ? 8 : 16;
        breathPhase += (6.283 / period) * (dt > 0.1 ? 0.033 : dt);
        const pulse = (Math.sin(breathPhase) + 1) * 0.5;

        // CSS変数でアニメーション。JSでの余計な計算を省く（低燃費）
        const root = document.documentElement;
        root.style.setProperty('--bonji-op', (0.3 + pulse * 0.5) * fade);
        root.style.setProperty('--ring-op', (0.2 + pulse * 0.4) * fade);
        root.style.setProperty('--ring-scale', 0.5 + pulse * 0.5);

        material.uniforms.uTime.value = now;
        material.uniforms.uPulse.value = pulse;
        material.uniforms.uOpacity.value = (0.3 + pulse * 0.6) * fade;
        particleSystem.rotation.z = now * 0.05;
        renderer.render(scene, camera);
    }

    function startLoop() {
        const loop = (ts) => {
            rafId = requestAnimationFrame(loop);
            if (ts - lastFrameTime < TARGET_INTERVAL) return;
            lastFrameTime = ts; drawFrame(ts);
        };
        rafId = requestAnimationFrame(loop);
    }

    function updateUI() {
        const d = chakraData[currentChakraIndex];
        document.getElementById('kanji-display').innerText = d.kanji;
        document.getElementById('yomi-display').innerText = d.yomi;
        document.getElementById('on-display').innerText = `${d.on} / [ ${d.phonetic} ]`;
        document.getElementById('meaning').innerText = d.meaning;
        bonjiBg.innerText = d.bonji;
        
        let freq = tuningMode === 2 ? solfeggioFreqs[currentChakraIndex] : Tone.Frequency(d.note).transpose(tuningMode * 12).toFrequency();
        document.getElementById('note-display').innerText = `${tuningMode===2?'SOL':d.note} (${d.solfege}) / ${Math.round(freq)}Hz`;
        
        document.documentElement.style.setProperty('--accent-color', d.strColor);
        if (material) {
            material.uniforms.uColor.value.setHex(d.color);
            material.uniforms.uChakraId.value = d.id;
        }
        
        document.querySelectorAll('.chakra-btn').forEach((btn, i) => {
            btn.className = `chakra-btn ${i === currentChakraIndex ? 'active' : ''}`;
            btn.style.backgroundColor = i === currentChakraIndex ? d.strColor : 'rgba(0,0,0,0.5)';
        });

        if (isTuning && !isStopping) osc.frequency.rampTo(freq, 1.5);
    }

    async function toggleTuning() {
        if (isStopping) return;
        if (!isTuning) {
            isTuning = true; actionBtn.innerText = "TUNING STOP";
            await Tone.start(); initThree(); updateUI(); env.triggerAttack();
            requestWakeLock(); startLoop();
        } else {
            isStopping = true; actionBtn.disabled = true; actionBtn.innerText = "RESETTING..."; 
            stopStartTime = performance.now();
            env.triggerRelease(); releaseWakeLock();
            setTimeout(() => {
                cancelAnimationFrame(rafId);
                if(renderer) { renderer.dispose(); document.getElementById('webgl-container').innerHTML = ""; renderer = null; }
                isTuning = isStopping = false; actionBtn.disabled = false; actionBtn.innerText = "TUNING START";
            }, 3500);
        }
    }

    chakraData.forEach((c, i) => {
        const b = document.createElement('button'); b.className = 'chakra-btn'; b.innerText = c.id;
        b.onclick = () => { currentChakraIndex = i; updateUI(); };
        document.getElementById('chakra-selector').appendChild(b);
    });

    actionBtn.onclick = toggleTuning;
    document.getElementById('btn-vis').onclick = () => { visMode=(visMode+1)%3; material.uniforms.uVisMode.value=visMode; document.getElementById('btn-vis').innerText=visNames[visMode]; };
    document.getElementById('btn-tune').onclick = () => { tuningMode=(tuningMode+1)%3; updateUI(); document.getElementById('btn-tune').innerText=tuneNames[tuningMode]; };
    document.getElementById('btn-breath').onclick = () => { breathMode=(breathMode+1)%2; document.getElementById('btn-breath').innerText=breathNames[breathMode]; };

    window.addEventListener('resize', () => { if(camera && renderer) { camera.aspect=window.innerWidth/window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); }});
    updateUI();
</script>
</body>
</html>
