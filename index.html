<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="言霊チューナー">
    <title>言霊チューナー</title>

<link rel="apple-touch-icon" sizes="180x180" href="https://mashiroqun.github.io/kotodama/icon2.png?v=2">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;400;700;900&family=Noto+Sans+JP:wght@400;700;900&family=Noto+Sans+Siddham&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<style>
    :root { --bg-color: #000000; --text-color: #FFFFFF; --accent-color: #FF3333; }
    html, body { margin: 0; padding: 0; width: 100%; height: 100dvh; background-color: var(--bg-color); color: var(--text-color); font-family: 'Inter', sans-serif; overflow: hidden; touch-action: none; }
    
    #webgl-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
    #bonji-bg { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-family: 'Noto Sans Siddham', sans-serif; font-size: 45vh; color: rgba(0, 0, 0, 0.8); -webkit-text-stroke: 1px rgba(255, 255, 255, 0.3); text-shadow: 0 0 30px rgba(0,0,0,1), 0 0 20px var(--accent-color); opacity: 0.4; z-index: 1; pointer-events: none; will-change: opacity; }
    
    #ui-layer { position: relative; z-index: 3; display: flex; flex-direction: column; justify-content: space-between; align-items: center; height: 100%; padding: env(safe-area-inset-top) 5% env(safe-area-inset-bottom); box-sizing: border-box; background: linear-gradient(to bottom, rgba(0,0,0,0.4), transparent 30%, transparent 70%, rgba(0,0,0,0.6)); pointer-events: none; }
    #ui-layer > * { pointer-events: auto; }

    header { text-align: center; margin-top: 1vh; }
    .title-main { font-family: 'Noto Sans JP', sans-serif; font-size: clamp(20px, 6vw, 24px); font-weight: 900; letter-spacing: 5px; }
    .title-sub { font-size: 10px; letter-spacing: 6px; color: var(--accent-color); margin-top: 4px; transition: color 0.5s; }

    #central-node { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; width: 100%; position: relative; }
    .ruby-text { font-family: 'Noto Sans JP', sans-serif; font-weight: 700; font-size: 20px; letter-spacing: 6px; opacity: 0.8; height: 1.5em; }
    .kanji { font-family: 'Noto Sans JP', sans-serif; font-weight: 900; font-size: clamp(100px, 28vw, 130px); color: var(--accent-color); transition: color 0.5s; line-height: 1; margin: 10px 0; }
    .on-guide { font-size: 18px; color: #EEE; }
    .note-display { font-size: 14px; font-weight: 700; letter-spacing: 2px; color: #FFF; opacity: 0.7; }

    /* Glassmorphism Panel: iPhone 15用に磨き上げ */
    #control-panel { 
        width: 100%; max-width: 400px; margin-bottom: 2vh;
        background: rgba(25, 25, 25, 0.3);
        backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
        border: 0.5px solid rgba(255, 255, 255, 0.15);
        border-radius: 32px; padding: 20px; box-sizing: border-box;
    }

    #meaning { font-size: clamp(11px, 3.2vw, 13px); opacity: 0.8; margin-bottom: 15px; font-family: 'Noto Sans JP'; color: #CCC; }
    #chakra-selector { display: flex; justify-content: space-between; gap: 6px; margin-bottom: 15px; }
    .chakra-btn { flex: 1; aspect-ratio: 1/1; border-radius: 50%; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.5); color: #FFF; font-weight: 700; font-size: 14px; transition: all 0.3s; }
    .chakra-btn.active { transform: scale(1.1); border-color: #FFF; box-shadow: 0 0 15px var(--accent-color); }

    #action-btn { 
        width: 100%; padding: 18px; border-radius: 35px; 
        background: rgba(0,0,0,0.6); border: 2px solid var(--accent-color);
        color: var(--accent-color); font-size: 18px; font-weight: 900; letter-spacing: 3px;
        margin-bottom: 15px; transition: all 0.2s;
    }
    #action-btn:active { transform: scale(0.97); }

    #debug-panel { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 15px; }
    .toggle-btn { background: rgba(255,255,255,0.08); border: 0.5px solid rgba(255,255,255,0.15); color: #FFF; font-size: 10px; padding: 10px 0; border-radius: 10px; }
    
    #btn-timer-display { background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.3); font-weight: 900; padding: 12px; border-radius: 15px; width: 100%; color: #FFF; }
</style>
</head>
<body>
    <div id="webgl-container"></div>
    <div id="bonji-bg">𑖀</div>
    <div id="ui-layer">
        <header>
            <div class="title-main">言霊チューナー</div>
            <div class="title-sub">CHAKRA TUNER</div>
        </header>

        <div id="central-node">
            <div id="yomi-display" class="ruby-text">ち</div>
            <div id="kanji-display" class="kanji">地</div>
            <div id="on-display" class="on-guide">ア / [ a ]</div>
            <div id="note-display" class="note-display">C3 (ド) / 131Hz</div>
        </div>

        <div id="control-panel">
            <div id="meaning">土 / 基盤 / 生命 / 会陰</div>
            <div id="chakra-selector"></div>
            <button id="action-btn">TUNING START</button>
            <div id="debug-panel">
                <button id="btn-vis" class="toggle-btn">VIS: 統合3D</button>
                <button id="btn-tune" class="toggle-btn">TUNE: 基本</button>
                <button id="btn-breath" class="toggle-btn">呼吸: 8秒</button>
            </div>
            <button id="btn-timer-display" onclick="cycleTimer()">TIMER: 10M</button>
        </div>
    </div>

<script>
    // 元の重厚なデータ構造を復帰
    const chakraData = [
        { id: 1, kanji: "地", yomi: "ち", on: "ア", phonetic: "a", note: "C3", solfege: "ド", color: 0xFF3333, strColor: "#FF3333", bonji: "𑖀", meaning: "土 / 基盤 / 生命 / 会陰" },
        { id: 2, kanji: "海", yomi: "うみ", on: "ウ", phonetic: "u", note: "D3", solfege: "レ", color: 0xFF8C00, strColor: "#FF8C00", bonji: "𑖪", meaning: "水 / 創造 / 感情 / 丹田" },
        { id: 3, kanji: "陽", yomi: "よう", on: "オ", phonetic: "o", note: "E3", solfege: "ミ", color: 0xFFD700, strColor: "#FFD700", bonji: "𑖨", meaning: "火 / 意志 / 活力 / みぞおち" },
        { id: 4, kanji: "和", yomi: "わ", on: "オ", phonetic: "o", note: "F3", solfege: "ファ", color: 0x00CC66, strColor: "#00CC66", bonji: "𑖮", meaning: "風 / 調和 / 愛 / 胸" },
        { id: 5, kanji: "響", yomi: "ひびき", on: "エ", phonetic: "e", note: "G3", solfege: "ソ", color: 0x00BFFF, strColor: "#00BFFF", bonji: "𑖏", meaning: "空 / 表現 / 空間 / 喉" },
        { id: 6, kanji: "理", yomi: "ことわり", on: "イ", phonetic: "i", note: "A3", solfege: "ラ", color: 0x4169E1, strColor: "#4169E1", bonji: "𑖌", meaning: "識 / 直感 / 叡智 / 眉間" },
        { id: 7, kanji: "宙", yomi: "そら", on: "ン", phonetic: "m", note: "B3", solfege: "シ", color: 0xEE82EE, strColor: "#EE82EE", bonji: "𑖮𑖳𑖽", meaning: "(吽) / 統合 / 超越 / 頭頂" }
    ];

    let currentIdx = 0, isTuning = false, isStopping = false, timerMins = 10, timerStepIdx = 2;
    let visMode = 2, tuningMode = 0, breathMode = 0, sessionStartTime = 0;
    const timerSteps = [0, 5, 10, 20, 30, 45, 60];

    // --- Audio Logic (Original Tone.js) ---
    const env = new Tone.AmplitudeEnvelope({ attack: 1.5, release: 3 }).toDestination();
    const osc = new Tone.Oscillator(440, "triangle").connect(env);

    function cycleTimer() {
        if (isTuning) return;
        timerStepIdx = (timerStepIdx + 1) % timerSteps.length;
        timerMins = timerSteps[timerStepIdx];
        document.getElementById('btn-timer-display').innerText = timerMins === 0 ? "TIMER: OFF" : `TIMER: ${timerMins}M`;
    }

    async function toggleTuning() {
        if (isStopping) return;
        if (!isTuning) {
            await Tone.start();
            isTuning = true;
            sessionStartTime = performance.now();
            const freq = Tone.Frequency(chakraData[currentIdx].note).transpose(tuningMode * 12).toFrequency();
            osc.frequency.value = freq;
            osc.start(); env.triggerAttack();
            document.getElementById('action-btn').innerText = "TUNING STOP";
        } else {
            stopTuning();
        }
    }

    function stopTuning() {
        isTuning = false; isStopping = true;
        env.triggerRelease();
        document.getElementById('action-btn').innerText = "RESETTING...";
        setTimeout(() => {
            osc.stop();
            isStopping = false;
            document.getElementById('action-btn').innerText = "TUNING START";
            document.getElementById('btn-timer-display').innerText = timerMins === 0 ? "TIMER: OFF" : `TIMER: ${timerMins}M`;
        }, 3200);
    }

    // --- Three.js Logic (Restored Heavy Shader) ---
    let renderer, scene, camera, material, rafId;
    function initThree() {
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000);
        camera.position.z = 400;
        renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio > 2 ? 2 : window.devicePixelRatio);
        document.getElementById('webgl-container').appendChild(renderer.domElement);

        const geo = new THREE.BufferGeometry();
        const count = 400;
        const pos = new Float32Array(count * 3);
        const idx = new Float32Array(count);
        for(let i=0; i<count; i++) idx[i] = i/count;
        geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
        geo.setAttribute('aIndex', new THREE.BufferAttribute(idx, 1));

        material = new THREE.ShaderMaterial({
            uniforms: { uTime:{value:0}, uPulse:{value:0}, uColor:{value:new THREE.Color(0xffffff)}, uVisMode:{value:2}, uChakraId:{value:1} },
            vertexShader: `
                uniform float uTime, uPulse, uVisMode, uChakraId;
                attribute float aIndex;
                void main() {
                    float t = aIndex * 6.28318 + uTime * 0.15;
                    float S = 140.0 + uPulse * 50.0;
                    vec3 p;
                    if(uVisMode < 0.5) p = vec3(sin(t)*S, cos(t)*S, 0.0);
                    else if(uVisMode < 1.5) p = vec3(sin(t*uChakraId)*S, cos(t*2.0)*S, sin(t)*30.0);
                    else p = vec3(sin(t*uChakraId)*S, cos(t*3.0)*S, cos(t*uChakraId)*S);
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
                    gl_PointSize = (3.0 + uPulse * 4.0);
                }
            `,
            fragmentShader: `
                uniform vec3 uColor;
                void main() {
                    if(length(gl_PointCoord - 0.5) > 0.5) discard;
                    gl_FragColor = vec4(uColor, 0.75);
                }
            `,
            transparent: true, blending: THREE.AdditiveBlending
        });
        scene.add(new THREE.Points(geo, material));
        loop();
    }

    function loop() {
        rafId = requestAnimationFrame(loop);
        const now = performance.now();
        const elapsed = (now - sessionStartTime) * 0.001;

        if (isTuning && timerMins > 0) {
            const remain = Math.max(0, timerMins * 60 - elapsed);
            const m = Math.floor(remain / 60), s = Math.floor(remain % 60);
            document.getElementById('btn-timer-display').innerText = `${m}:${s < 10 ? '0' : ''}${s}`;
            if (remain <= 0) stopTuning();
        }

        const pulse = Math.abs(Math.sin(elapsed * Math.PI / (breathMode === 0 ? 4 : 8)));
        if(material) {
            material.uniforms.uTime.value = elapsed;
            material.uniforms.uPulse.value = pulse;
            material.uniforms.uColor.value.setHex(chakraData[currentIdx].color);
            material.uniforms.uVisMode.value = visMode;
            material.uniforms.uChakraId.value = chakraData[currentIdx].id;
        }
        document.getElementById('bonji-bg').style.opacity = 0.1 + pulse * 0.4;
        renderer.render(scene, camera);
    }

    function updateDisplay() {
        const d = chakraData[currentIdx];
        document.getElementById('kanji-display').innerText = d.kanji;
        document.getElementById('yomi-display').innerText = d.yomi;
        document.getElementById('on-display').innerText = `${d.on} / [ ${d.phonetic} ]`;
        document.getElementById('meaning').innerText = d.meaning;
        document.getElementById('bonji-bg').innerText = d.bonji;
        document.documentElement.style.setProperty('--accent-color', d.strColor);
        document.querySelectorAll('.chakra-btn').forEach((b, i) => b.classList.toggle('active', i === currentIdx));
    }

    chakraData.forEach((c, i) => {
        const b = document.createElement('button');
        b.className = 'chakra-btn'; b.innerText = c.id;
        b.onclick = () => { if(!isTuning) { currentIdx = i; updateDisplay(); } };
        document.getElementById('chakra-selector').appendChild(b);
    });

    document.getElementById('action-btn').onclick = toggleTuning;
    document.getElementById('btn-vis').onclick = () => visMode = (visMode + 1) % 3;
    document.getElementById('btn-tune').onclick = () => { tuningMode = (tuningMode + 1) % 2; updateDisplay(); };
    document.getElementById('btn-breath').onclick = () => breathMode = (breathMode + 1) % 2;

    window.onload = () => { initThree(); updateDisplay(); };
</script>
</body>
</html>
