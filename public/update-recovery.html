<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0b12">
  <title>言霊チューナー｜更新の修復</title>
  <style>
    :root{color-scheme:dark}
    *{box-sizing:border-box}
    body{min-height:100dvh;margin:0;padding:calc(env(safe-area-inset-top,0px) + 24px) 20px calc(env(safe-area-inset-bottom,0px) + 24px);background:#0b0b12;color:#f5f5f7;display:grid;place-items:center;font:15px/1.75 -apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}
    main{width:min(100%,390px);padding:26px 24px;border:1px solid #41414d;border-radius:22px;background:#1b1b26}
    h1{font-size:20px;letter-spacing:.04em;margin:0 0 16px}
    p{margin:0 0 18px;color:#d5d5de}
    button,a{width:100%;min-height:48px;display:grid;place-items:center;border-radius:12px;font:700 15px -apple-system,sans-serif;text-decoration:none;touch-action:manipulation}
    button{color:#081216;background:#80d4dd;border:0;cursor:pointer}
    button:disabled{opacity:.5}
    a{color:#fff;border:1px solid #676777;margin-top:12px}
    #state{min-height:2em;margin-top:18px;font-size:13px;overflow-wrap:anywhere}
    small{display:block;margin-top:15px;color:#aeb2c2;font-size:12px}
  </style>
</head>
<body>
  <main>
    <h1>言霊チューナー｜更新の修復</h1>
    <p>UPDATEで以前のメッセージが繰り返される場合に使います。古いアプリのキャッシュとサービスワーカーを整理し、最新版を読み込み直します。</p>
    <p><strong>音声や音程の設定を変更する操作ではありません。</strong> 再生・録音を止めてから行ってください。オンライン接続が必要です。</p>
    <button id="repair" type="button">古い更新情報を修復して開く</button>
    <a href="./">修復せずアプリに戻る</a>
    <p id="state" role="status" aria-live="polite">ボタンを押すまでは何も変更しません。</p>
    <small>このページは通常のアプリとは別の入口です。古いサービスワーカーのキャッシュ対象外なので、通常のUPDATEが動かないときにも開ける設計です。</small>
  </main>
  <script>
    const button = document.getElementById('repair');
    const state = document.getElementById('state');
    button.addEventListener('click', async () => {
      if (!navigator.onLine) {
        state.textContent = 'ネットワークに接続してからお試しください。';
        return;
      }
      button.disabled = true;
      state.textContent = '古い更新情報を確認しています…';
      try {
        const base = new URL('./', location.href);
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          for (const registration of registrations) {
            if (registration.scope.startsWith(base.href)) {
              await registration.unregister();
            }
          }
        }
        if ('caches' in window) {
          const keys = await caches.keys();
          for (const key of keys) {
            if (key.startsWith('kotodama-') ||
                key.startsWith('workbox-precache-')) {
              await caches.delete(key);
            }
          }
        }
        state.textContent = '更新情報を整理しました。アプリを開き直します…';
        // Current page is self-contained, and the destination reloads from the network.
        location.replace(new URL('./?recovery=' + Date.now(), base).href);
      } catch (error) {
        button.disabled = false;
        state.textContent = '修復が完了しませんでした。Safariで開き直してください。' +
          (error && error.message ? '（' + error.message + '）' : '');
      }
    });
  </script>
</body>
</html>
